project:
  name: smart_robot_wheel_actuator_v0
  version: 0.1.0

libraries:
  - ../../../../libs/generic
  - ../../../../libs/vendor/artery/mcus
  - ../../../../libs/vendor/jst/connectors
  - ../../../../libs/vendor/ti/can_transceivers
  - ../../../../libs/vendor/ti/esd_protection
  - ../../../../libs/vendor/ti/motor_drivers
  - ../models

board:
  components:
    U1:
      model: vendor.artery.at32m416_motor_control
      part_number: AT32M416
      power_domains:
        VDD: 3v3_logic
      pins:
        VDD: 3v3_logic
        GND: gnd
        CAN_TX: wheel_can_tx
        CAN_RX: wheel_can_rx
        PWM_UH: drv_inha
        PWM_UL: drv_inla
        PWM_VH: drv_inhb
        PWM_VL: drv_inlb
        PWM_WH: drv_inhc
        PWM_WL: drv_inlc
        DRV_EN: drv_enable
        DRV_NFAULT: drv_nfault
        DRV_SPI_SCK: drv_spi_sck
        DRV_SPI_MOSI: drv_spi_mosi
        DRV_SPI_MISO: drv_spi_miso
        DRV_SPI_CS: drv_spi_cs
        CUR_U: cur_u
        CUR_V: cur_v
        CUR_W: cur_w
        ENC_A: enc_a
        ENC_B: enc_b
        ENC_Z: enc_z
        ENABLE_IN: enable_in
        FAULT_OUT: fault_out
    U2:
      model: vendor.ti.drv8323
      part_number: DRV8323
      power_domains:
        VM: vwheel_sw
        DVDD: 3v3_logic
      pins:
        VM: vwheel_sw
        DVDD: 3v3_logic
        GND: gnd
        INHA: drv_inha
        INLA: drv_inla
        INHB: drv_inhb
        INLB: drv_inlb
        INHC: drv_inhc
        INLC: drv_inlc
        ENABLE: drv_enable
        NFAULT: drv_nfault
        SCLK: drv_spi_sck
        SDI: drv_spi_mosi
        SDO: drv_spi_miso
        NCS: drv_spi_cs
        SOA: cur_u
        SOB: cur_v
        SOC: cur_w
    U3:
      model: vendor.ti.tcan3413
      part_number: TCAN3413DR
      power_domains:
        VCC: 3v3_logic
        VIO: 3v3_logic
      pins:
        VCC: 3v3_logic
        VIO: 3v3_logic
        GND: gnd
        TXD: wheel_can_tx
        RXD: wheel_can_rx
        STB: gnd
        CANH: robot_canh
        CANL: robot_canl
    UCAN_ESD1:
      model: vendor.ti.esd2can24_q1
      part_number: ESD2CAN24-Q1
      pins:
        CANH: robot_canh
        CANL: robot_canl
        GND: gnd
    RT_CAN1:
      model: generic.analog.resistor
      part_number: 120R_CAN_TERM_ENDPOINT_OPTION
      pins:
        A: robot_canh
        B: robot_canl
      spice:
        primitive: resistor
        value_ohm: 120.0
    ENC1:
      model: demo.smart_robot.encoder_hall_3v3
      part_number: ENCODER_OR_HALL_3V3
      power_domains:
        VCC: 3v3_logic
      pins:
        VCC: 3v3_logic
        GND: gnd
        A: enc_a
        B: enc_b
        Z: enc_z
    PWR_STAGE:
      model: demo.smart_robot.csd88599q5dc_3phase_bridge_budget
      part_number: 3x_CSD88599Q5DC_PRELIMINARY
      power_domains:
        VM: vwheel_sw
      pins:
        VM: vwheel_sw
        GND: gnd
        PHASE_U: phase_u
        PHASE_V: phase_v
        PHASE_W: phase_w
    M1:
      model: demo.smart_robot.wheel_motor_design_envelope
      part_number: WHEEL_MOTOR_DESIGN_ENVELOPE
      pins:
        PHASE_U: phase_u
        PHASE_V: phase_v
        PHASE_W: phase_w
    JACT1:
      model: vendor.jst.vh_8pin_actuator_bus_header
      part_number: B8P-VH_ACTUATOR_BUS
      pins:
        VBAT: vwheel_sw
        GND: gnd
        CANH: robot_canh
        CANL: robot_canl
        AUX_5V: 5v_aux
        ENABLE: enable_in
        FAULT: fault_out
        SYNC: sync_in
  nets:
    vwheel_sw:
      kind: power
      nominal_voltage: 7.4
      powered: true
      supply_current_limit_A: 8.0
    3v3_logic:
      kind: power
      nominal_voltage: 3.3
      powered: true
      supply_current_limit_A: 0.5
    5v_aux:
      kind: power
      nominal_voltage: 5.0
      powered: true
      supply_current_limit_A: 0.5
    gnd:
      kind: ground
    wheel_can_tx:
      kind: digital_or_analog
    wheel_can_rx:
      kind: digital_or_analog
    robot_canh:
      kind: digital_or_analog
    robot_canl:
      kind: digital_or_analog
    drv_inha:
      kind: digital_or_analog
    drv_inla:
      kind: digital_or_analog
    drv_inhb:
      kind: digital_or_analog
    drv_inlb:
      kind: digital_or_analog
    drv_inhc:
      kind: digital_or_analog
    drv_inlc:
      kind: digital_or_analog
    drv_enable:
      kind: digital_or_analog
    drv_nfault:
      kind: digital_or_analog
    drv_spi_sck:
      kind: digital_or_analog
    drv_spi_mosi:
      kind: digital_or_analog
    drv_spi_miso:
      kind: digital_or_analog
    drv_spi_cs:
      kind: digital_or_analog
    cur_u:
      kind: digital_or_analog
    cur_v:
      kind: digital_or_analog
    cur_w:
      kind: digital_or_analog
    enc_a:
      kind: digital_or_analog
    enc_b:
      kind: digital_or_analog
    enc_z:
      kind: digital_or_analog
    enable_in:
      kind: digital_or_analog
    fault_out:
      kind: digital_or_analog
    sync_in:
      kind: digital_or_analog
    phase_u:
      kind: digital_or_analog
    phase_v:
      kind: digital_or_analog
    phase_w:
      kind: digital_or_analog
  layout:
    placements:
      JACT1:
        x_mm: 10.0
        y_mm: 12.0
        side: top
      UCAN_ESD1:
        x_mm: 13.0
        y_mm: 12.0
        side: top
      RT_CAN1:
        x_mm: 17.0
        y_mm: 12.0
        side: top
      U3:
        x_mm: 22.0
        y_mm: 12.0
        side: top
    routes:
      robot_canh:
        segments:
          - start: { x_mm: 10.0, y_mm: 11.8 }
            end: { x_mm: 22.0, y_mm: 11.8 }
            width_mm: 0.18
            layer: F.Cu
      robot_canl:
        segments:
          - start: { x_mm: 10.0, y_mm: 12.2 }
            end: { x_mm: 22.0, y_mm: 12.2 }
            width_mm: 0.18
            layer: F.Cu
      vwheel_sw:
        segments:
          - start: { x_mm: 10.0, y_mm: 8.5 }
            end: { x_mm: 45.0, y_mm: 22.0 }
            width_mm: 1.50
            layer: F.Cu
          - start: { x_mm: 45.0, y_mm: 22.0 }
            end: { x_mm: 58.0, y_mm: 26.5 }
            width_mm: 1.50
            layer: F.Cu
      phase_u:
        segments:
          - start: { x_mm: 64.0, y_mm: 27.0 }
            end: { x_mm: 81.5, y_mm: 28.0 }
            width_mm: 1.20
            layer: F.Cu
      phase_v:
        segments:
          - start: { x_mm: 64.0, y_mm: 29.0 }
            end: { x_mm: 81.5, y_mm: 29.0 }
            width_mm: 1.20
            layer: F.Cu
      phase_w:
        segments:
          - start: { x_mm: 64.0, y_mm: 31.0 }
            end: { x_mm: 81.5, y_mm: 30.0 }
            width_mm: 1.20
            layer: F.Cu

scenarios:
  - name: wheel_actuator_static_power_and_io
    type: power_tree
    checks:
      - POWER_TREE_VALID
      - IO_VOLTAGE_COMPATIBLE
  - name: wheel_actuator_bridge_budget
    type: motor_drive
    checks:
      - MOTOR_BRIDGE_BUDGET_VALID
    target:
      component: PWR_STAGE
    parameters:
      motor_component: M1
      bridge_reference_current_A: 15.0
      bridge_device_current_class_A: 40.0
      phase_shunt_resistance_ohm: 0.005
      phase_shunt_power_rating_W: 1.0
      min_shunt_power_margin_ratio: 2.0
      max_shunt_sense_voltage_V: 0.15
      motor_connector_current_rating_A: 8.0
      gate_resistor_ohm: 10.0
      dead_time_ns: 200.0
      pwm_frequency_Hz: 20000.0
  - name: wheel_actuator_phase_route_current
    type: motor_drive
    checks:
      - MOTOR_ROUTE_CURRENT_VALID
    target:
      component: PWR_STAGE
    parameters:
      motor_component: M1
      current_source: phase_rms
      route_nets: [phase_u, phase_v, phase_w]
      max_current_density_A_per_mm: 5.0
  - name: wheel_actuator_vbat_regen_route_current
    type: motor_drive
    checks:
      - MOTOR_ROUTE_CURRENT_VALID
    target:
      component: PWR_STAGE
    parameters:
      motor_component: M1
      current_source: max_regen
      route_nets: [vwheel_sw]
      max_current_density_A_per_mm: 4.0
  - name: wheel_actuator_bus_connector_budget
    type: load_budget
    checks:
      - LOAD_CONNECTOR_CURRENT_VALID
    target:
      component: PWR_STAGE
      power_pin: VM
    parameters:
      connector_component: JACT1
      min_connector_current_margin_ratio: 1.5
  - name: wheel_actuator_can_esd_canh
    type: interface_protection
    checks:
      - INTERFACE_PROTECTION_REVIEW
    target:
      component: UCAN_ESD1
    parameters:
      clamp: canh
  - name: wheel_actuator_can_esd_canl
    type: interface_protection
    checks:
      - INTERFACE_PROTECTION_REVIEW
    target:
      component: UCAN_ESD1
    parameters:
      clamp: canl
  - name: wheel_actuator_can_endpoint_termination
    type: interface_protection
    checks:
      - BUS_TERMINATION_VALID
    parameters:
      line_a_net: robot_canh
      line_b_net: robot_canl
      board_is_bus_endpoint: true
      termination_component: RT_CAN1
      expected_termination_ohm: 120.0
      termination_tolerance_percent: 5.0
  - name: wheel_actuator_can_esd_route_placement
    type: interface_protection
    checks:
      - BUS_PROTECTION_PLACEMENT_VALID
    parameters:
      line_a_net: robot_canh
      line_b_net: robot_canl
      reference_component: JACT1
      checked_component: UCAN_ESD1
      max_reference_to_checked_route_distance_mm: 5.0
      max_component_to_route_distance_mm: 0.25
  - name: wheel_actuator_can_termination_route_placement
    type: interface_protection
    checks:
      - BUS_PROTECTION_PLACEMENT_VALID
    parameters:
      line_a_net: robot_canh
      line_b_net: robot_canl
      reference_component: JACT1
      checked_component: RT_CAN1
      max_reference_to_checked_route_distance_mm: 8.0
      max_component_to_route_distance_mm: 0.25
