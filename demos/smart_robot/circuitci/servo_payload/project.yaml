project:
  name: smart_robot_servo_payload_v0
  version: 0.1.0

libraries:
  - ../../../../libs/vendor/artery/mcus
  - ../../../../libs/vendor/nxp/pwm_drivers
  - ../models

board:
  components:
    U1:
      model: vendor.artery.at32f435_motion_core
      part_number: AT32F435-motion-core-payload-i2c-budget
      power_domains:
        VDD: 3v3_logic
      pins:
        VDD: 3v3_logic
        GND: gnd
        I2C2_SCL: pca9685_scl
        I2C2_SDA: pca9685_sda
        SERVO_PWM_OE: pca9685_oe
    U2:
      model: vendor.nxp.pca9685
      part_number: PCA9685
      power_domains:
        VDD: 3v3_logic
      pins:
        VDD: 3v3_logic
        VSS: gnd
        SCL: pca9685_scl
        SDA: pca9685_sda
        OE: pca9685_oe
        PWM0: servo0_pwm
        PWM1: servo1_pwm
        PWM2: servo2_pwm
        PWM3: servo3_pwm
    SV0:
      model: demo.smart_robot.pwm_servo_6v_design_load
      part_number: LOW_LOAD_PWM_SERVO_0
      power_domains:
        VCC: vservo_sw
      pins:
        VCC: vservo_sw
        GND: gnd
        PWM: servo0_pwm
    SV1:
      model: demo.smart_robot.pwm_servo_6v_design_load
      part_number: LOW_LOAD_PWM_SERVO_1
      power_domains:
        VCC: vservo_sw
      pins:
        VCC: vservo_sw
        GND: gnd
        PWM: servo1_pwm
    SV2:
      model: demo.smart_robot.pwm_servo_6v_design_load
      part_number: LOW_LOAD_PWM_SERVO_2
      power_domains:
        VCC: vservo_sw
      pins:
        VCC: vservo_sw
        GND: gnd
        PWM: servo2_pwm
    SV3:
      model: demo.smart_robot.pwm_servo_6v_design_load
      part_number: LOW_LOAD_PWM_SERVO_3
      power_domains:
        VCC: vservo_sw
      pins:
        VCC: vservo_sw
        GND: gnd
        PWM: servo3_pwm
  nets:
    3v3_logic:
      kind: power
      nominal_voltage: 3.3
      powered: true
      supply_current_limit_A: 0.5
    vservo_sw:
      kind: power
      nominal_voltage: 7.4
      powered: true
      supply_current_limit_A: 4.0
    gnd:
      kind: ground
    pca9685_scl:
      kind: digital_or_analog
    pca9685_sda:
      kind: digital_or_analog
    pca9685_oe:
      kind: digital_or_analog
    servo0_pwm:
      kind: digital_or_analog
    servo1_pwm:
      kind: digital_or_analog
    servo2_pwm:
      kind: digital_or_analog
    servo3_pwm:
      kind: digital_or_analog

scenarios:
  - name: servo_payload_static_power_and_io
    type: power_tree
    checks:
      - POWER_TREE_VALID
      - IO_VOLTAGE_COMPATIBLE
