libraries:
  - ../../../../libs/generic
  - ../../../../libs/vendor/artery/mcus
  - ../../../../libs/vendor/jst/connectors
  - ../../../../libs/vendor/ti/can_transceivers
  - ../../../../libs/vendor/ti/esd_protection
  - ../../../../libs/vendor/ti/motor_drivers
  - ../../circuitci/models

components:
  U1:
    model: vendor.artery.at32m416_motor_control
    part_number: AT32M416
    pin_map:
      VDD: VDD
      GND: GND
      CAN_TX: CAN_TX
      CAN_RX: CAN_RX
      PWM_UH: PWM_UH
      PWM_UL: PWM_UL
      PWM_VH: PWM_VH
      PWM_VL: PWM_VL
      PWM_WH: PWM_WH
      PWM_WL: PWM_WL
      DRV_EN: DRV_EN
      DRV_NFAULT: DRV_NFAULT
      DRV_SPI_SCK: DRV_SPI_SCK
      DRV_SPI_MOSI: DRV_SPI_MOSI
      DRV_SPI_MISO: DRV_SPI_MISO
      DRV_SPI_CS: DRV_SPI_CS
      CUR_U: CUR_U
      CUR_V: CUR_V
      CUR_W: CUR_W
      ENC_A: ENC_A
      ENC_B: ENC_B
      ENC_Z: ENC_Z
      ENABLE_IN: ENABLE_IN
      FAULT_OUT: FAULT_OUT
  U2:
    model: vendor.ti.drv8323
    part_number: DRV8323
    pin_map:
      VM: VM
      DVDD: DVDD
      GND: GND
      INHA: INHA
      INLA: INLA
      INHB: INHB
      INLB: INLB
      INHC: INHC
      INLC: INLC
      ENABLE: ENABLE
      NFAULT: NFAULT
      SCLK: SCLK
      SDI: SDI
      SDO: SDO
      NCS: NCS
      SOA: SOA
      SOB: SOB
      SOC: SOC
  U3:
    model: vendor.ti.tcan3413
    part_number: TCAN3413DR
    pin_map:
      VCC: VCC
      VIO: VIO
      GND: GND
      TXD: TXD
      RXD: RXD
      STB: STB
      CANH: CANH
      CANL: CANL
  UCAN_ESD1:
    model: vendor.ti.esd2can24_q1
    part_number: ESD2CAN24-Q1
    pin_map:
      CANH: CANH
      CANL: CANL
      GND: GND
  RT_CAN1:
    model: generic.analog.resistor
    part_number: 120R_CAN_TERM_ENDPOINT_OPTION
    pin_map:
      A: A
      B: B
    spice:
      primitive: resistor
      value_ohm: 120.0
  ENC1:
    model: demo.smart_robot.encoder_hall_3v3
    part_number: ENCODER_OR_HALL_3V3
    pin_map:
      VCC: VCC
      GND: GND
      A: A
      B: B
      Z: Z
  PWR_STAGE:
    model: demo.smart_robot.csd88599q5dc_3phase_bridge_budget
    part_number: 3x_CSD88599Q5DC_PRELIMINARY
    pin_map:
      VM: VM
      GND: GND
      PHASE_U: PHASE_U
      PHASE_V: PHASE_V
      PHASE_W: PHASE_W
  REGEN1:
    model: demo.smart_robot.vishay_rh100_1r0_regen_absorber
    part_number: RH100_1R0_FIRST_PASS_REGEN_ABSORBER
    pin_map:
      BUS: BUS
      GND: GND
  RSHUNT_U:
    model: generic.analog.resistor
    part_number: 5mR_1W_PHASE_SHUNT_U
    pin_map:
      A: A
      B: B
    spice:
      primitive: resistor
      value_ohm: 0.005
  RSHUNT_V:
    model: generic.analog.resistor
    part_number: 5mR_1W_PHASE_SHUNT_V
    pin_map:
      A: A
      B: B
    spice:
      primitive: resistor
      value_ohm: 0.005
  RSHUNT_W:
    model: generic.analog.resistor
    part_number: 5mR_1W_PHASE_SHUNT_W
    pin_map:
      A: A
      B: B
    spice:
      primitive: resistor
      value_ohm: 0.005
  M1:
    model: demo.smart_robot.wheel_motor_design_envelope
    part_number: WHEEL_MOTOR_DESIGN_ENVELOPE
    pin_map:
      PHASE_U: PHASE_U
      PHASE_V: PHASE_V
      PHASE_W: PHASE_W
  JACT1:
    model: vendor.jst.vh_8pin_actuator_bus_header
    part_number: B8P-VH_ACTUATOR_BUS
    pin_map:
      VBAT: VBAT
      GND: GND
      CANH: CANH
      CANL: CANL
      AUX_5V: AUX_5V
      ENABLE: ENABLE
      FAULT: FAULT
      SYNC: SYNC
  JACT1_CABLE:
    model: demo.smart_robot.jst_vh_awg16_0p5m_actuator_harness
    part_number: JST_VH_AWG16_0P5M_ACTUATOR_HARNESS
    pin_map:
      VBAT_SRC: VBAT_SRC
      VBAT_LOAD: VBAT_LOAD
      GND_SRC: GND_SRC
      GND_LOAD: GND_LOAD

nets:
  vwheel_sw:
    kind: power
    nominal_voltage: 7.4
    powered: true
    supply_current_limit_A: 8.0
  3v3_logic:
    kind: power
    nominal_voltage: 3.3
    powered: true
    supply_current_limit_A: 0.5
  5v_aux:
    kind: power
    nominal_voltage: 5.0
    powered: true
    supply_current_limit_A: 0.5
  gnd:
    kind: ground
  wheel_can_tx:
    kind: digital_or_analog
  wheel_can_rx:
    kind: digital_or_analog
  robot_canh:
    kind: digital_or_analog
  robot_canl:
    kind: digital_or_analog
  drv_inha:
    kind: digital_or_analog
  drv_inla:
    kind: digital_or_analog
  drv_inhb:
    kind: digital_or_analog
  drv_inlb:
    kind: digital_or_analog
  drv_inhc:
    kind: digital_or_analog
  drv_inlc:
    kind: digital_or_analog
  drv_enable:
    kind: digital_or_analog
  drv_nfault:
    kind: digital_or_analog
  drv_spi_sck:
    kind: digital_or_analog
  drv_spi_mosi:
    kind: digital_or_analog
  drv_spi_miso:
    kind: digital_or_analog
  drv_spi_cs:
    kind: digital_or_analog
  cur_u:
    kind: digital_or_analog
  cur_v:
    kind: digital_or_analog
  cur_w:
    kind: digital_or_analog
  enc_a:
    kind: digital_or_analog
  enc_b:
    kind: digital_or_analog
  enc_z:
    kind: digital_or_analog
  enable_in:
    kind: digital_or_analog
  fault_out:
    kind: digital_or_analog
  sync_in:
    kind: digital_or_analog
  phase_u:
    kind: digital_or_analog
  phase_v:
    kind: digital_or_analog
  phase_w:
    kind: digital_or_analog

scenarios:
  - name: wheel_actuator_selected_load_evidence_gate
    type: model_quality
    checks:
      - MODEL_QUALITY_REQUIRED
    parameters:
      components: [M1]
      allowed_sources: [datasheet, measured]
      min_confidence: medium
  - name: wheel_actuator_bus_cable_budget
    type: load_budget
    checks:
      - LOAD_CABLE_CURRENT_VALID
    target:
      component: PWR_STAGE
      power_pin: VM
    parameters:
      cable_component: JACT1_CABLE
      min_cable_current_margin_ratio: 1.5
  - name: wheel_actuator_bus_cable_thermal_derating
    type: load_budget
    checks:
      - LOAD_CABLE_THERMAL_DERATING_VALID
    target:
      component: PWR_STAGE
      power_pin: VM
    parameters:
      cable_component: JACT1_CABLE
      thermal_current_margin_ratio: 1.5
  - name: wheel_actuator_bus_cable_voltage_drop
    type: load_budget
    checks:
      - LOAD_CABLE_VOLTAGE_DROP_VALID
    target:
      component: PWR_STAGE
      power_pin: VM
    parameters:
      cable_component: JACT1_CABLE
      max_cable_voltage_drop_V: 0.3
      max_cable_power_loss_W: 2.0
      drop_current_margin_ratio: 1.5
