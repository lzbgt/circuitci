    required: true
  VCC:
    kind: electrical_power
    required: true
  VEE:
    kind: electrical_ground
    required: true
  OUT:
    kind: passive
    required: true
simulation:
  spice:
    model_name: CIRCUITCI_IDEAL_COMPARATOR
