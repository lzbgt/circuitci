simulation:
  spice:
    model_name: CIRCUITCI_CMSIS_DAP_SWD_PROBE
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: generic_behavioral
    pin_order: [VTREF, GND, SWCLK, SWDIO, NRESET, SWO]
    instance_parameters:
      - spice_name: SWCLK_STATE
        component_parameter: observation_swclk_state
        default_value: 1.0
      - spice_name: SWDIO_STATE
        component_parameter: observation_swdio_state
        default_value: 1.0
      - spice_name: NRESET_ASSERT
        component_parameter: observation_nreset_assert
        default_value: 0.0
    valid_operating_notes:
      - Reduced CMSIS-DAP SWD probe observation model for preliminary VTREF-referenced SWCLK, SWDIO, nRESET, and SWO line-state checks only.
      - Uses source-backed CMSIS-DAP SWD/JTAG pin-role semantics and default SWD setup behavior, while relying on the Board IR fixture to declare the target voltage and pull-up network.
      - USB transport, CMSIS-DAP command sequencing, SWD turnaround/protocol transfers, target-specific voltage limits, trace bandwidth, and probe-vendor drive strength are out of scope.
