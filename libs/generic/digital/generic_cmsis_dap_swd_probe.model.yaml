    kind: electrical_power
    required: true
  GND:
    kind: electrical_ground
    required: true
  SWCLK:
    kind: digital_electrical_output
    required: true
    electrical:
      drive_high_voltage_V: 2.9
      source_impedance_ohm: 100
  SWDIO:
    kind: digital_electrical_output
    required: true
    electrical:
      drive_high_voltage_V: 2.9
      source_impedance_ohm: 100
  NRESET:
    kind: digital_electrical_output
    required: false
  SWO:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
datasheet:
  manufacturer: Arm
  part_number: CMSIS-DAP SWD probe interface
  package: specification
  polarity: cmsis_dap_swd_probe
  pinout:
    VTREF: Target reference voltage
    GND: Ground
    SWCLK: SWCLK/TCK
    SWDIO: SWDIO/TMS
    NRESET: nRESET
    SWO: SWO
  device_parameters:
    cmsis_dap_role:
      conditions: CMSIS-DAP standardizes communication between host debug tools and Arm Cortex target processors through standalone or on-board debug units.
      unit: note
      simulation_relevance: Provides a source-backed generic debug-probe interface without binding to one probe vendor IC.
    swd_interface:
      conditions: CMSIS-DAP supports a two-pin Serial Wire Debug interface using SWCLK and SWDIO plus nRESET.
      unit: note
      simulation_relevance: Supports preliminary SWD header line-state observations.
    swdio_bidirectional:
      conditions: SWDIO/TMS is output push-pull and input for receiving data; CMSIS-DAP firmware exposes functions to switch SWDIO output on or off.
      unit: note
      simulation_relevance: The reduced model can represent a driven idle-state snapshot but is not a turnaround or protocol model.
    reset_behavior:
      conditions: nRESET is output open drain with pull-up resistor, and setup defaults nRESET high in SWD mode.
      unit: note
      simulation_relevance: Supports executable reset-release and reset-assertion observations when the target pull-up is modeled explicitly.
