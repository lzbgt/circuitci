simulation:
  spice:
    model_name: CIRCUITCI_AT24C02C_I2C_EEPROM_OBSERVATION
    model_type: subckt
    model_path: models/spice/microchip/at24c02c_i2c_eeprom_observation.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VCC, GND, A0, A1, A2, SDA, SCL, WP]
    valid_operating_notes:
      - Reduced high-impedance I2C EEPROM board-observation model for preliminary VCC rail, I2C pull-up, address-select, and write-protect line-state checks.
      - Uses source-backed 1.7 V to 5.5 V operating range, VCC-ratio input thresholds, SOIC-8 pin roles, 2 Kbit memory geometry, 8-byte page write, and 5 ms maximum self-timed write-cycle metadata.
      - I2C transactions, acknowledge polling, EEPROM contents, write-cycle timing sign-off, endurance/retention lifetime prediction, and bus signal integrity are out of scope.
