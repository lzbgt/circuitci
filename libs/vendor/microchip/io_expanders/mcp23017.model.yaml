    valid_operating_notes:
      - Reduced high-impedance I2C GPIO-expander board-observation model for preliminary VDD rail, I2C pull-up, address-select, reset, interrupt, and representative GPIO line-state checks.
      - Uses source-backed 1.8 V to 5.5 V operating range, 1.7 MHz I2C class, 28-pin SSOP pin roles, interrupt output metadata, and GPIO absolute output-current metadata.
      - I2C transactions, register state, GPIO direction, interrupt-on-change logic, weak pull-up behavior, per-pin output-load sign-off, and signal integrity are out of scope.
