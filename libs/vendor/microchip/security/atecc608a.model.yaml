    provenance: datasheet_limited_generic_behavioral
    pin_order: [VCC, GND, SDA, SCL]
    valid_operating_notes:
      - Reduced high-impedance ATECC608A I2C secure-element board-observation model for preliminary VCC rail and I2C pull-up line-state checks.
      - Uses source-backed 2.0 V to 5.5 V supply range, 1 MHz I2C class, 8-lead SOIC functional pin roles, and active/idle/sleep current metadata.
      - Cryptographic commands, provisioning, key storage, RNG behavior, secure boot policy, wake/sleep timing, single-wire operation, I2C transaction content, and signal integrity are out of scope.
