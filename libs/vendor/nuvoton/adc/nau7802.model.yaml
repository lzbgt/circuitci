    provenance: datasheet_limited_generic_behavioral
    pin_order: [DVDD, DVSS, AVDD, AVSS, REFP, REFN, VIN1P, VIN1N, VIN2P, VIN2N, SCLK, SDIO, DRDY, VBG]
    valid_operating_notes:
      - Reduced high-impedance NAU7802 bridge ADC board-observation model for preliminary DVDD/AVDD rail, reference, bridge-input, I2C pull-up, and DRDY line-state checks.
      - Uses source-backed 2.7 V to 5.5 V DVDD range, external 2.7 V to 5.5 V AVDD range, I2C-compatible 2-wire slave interface, and bridge ADC pin roles.
      - ADC conversion, PGA gain, calibration, register protocol, I2C timing, streaming mode, bridge excitation accuracy, oscillator behavior, temperature sensor behavior, and metrology accuracy are out of scope.
