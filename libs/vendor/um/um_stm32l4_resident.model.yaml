component_id: vendor.um.um_stm32l4_resident
version: 0.1.0
category: mcu
simulation:
  spice:
    model_name: CIRCUITCI_STM32L431_BOOT_UART_SWD_MCU
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VDD, VSS, NRST, BOOT0, PA9, PA10, PA13, PA14]
    instance_parameters:
      - spice_name: PA9_STATE
        component_parameter: observation_pa9_state
        default_value: 1.0
      - spice_name: PA13_STATE
        component_parameter: observation_pa13_state
        default_value: 1.0
    valid_operating_notes:
      - Reduced rail and board-facing line-state observation for preliminary UM STM32L4 boot/UART/SWD checks.
      - The STM32L431 VDD/VSS, NRST, BOOT0, USART1 PA9/PA10, and SWD PA13/PA14 pins are represented.
      - Static PA9 and PA13 states are explicit Board IR component parameters.
      - Resident bootloader protocol metadata remains behavioral; firmware execution, oscillator accuracy, reset timing, UART/SWD protocol timing, flash programming side effects, package-pin exhaustive mapping, layout/SI, EMC, and thermal behavior are outside this model.
