      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA9:
    kind: digital_electrical_output
    required: false
    electrical:
      drive_high_voltage_V: 3.3
      source_impedance_ohm: 50
  PA10:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA13:
    kind: digital_electrical_io
    required: false
    electrical:
      drive_high_voltage_V: 3.3
      source_impedance_ohm: 50
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA14:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
