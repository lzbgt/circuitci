    required: false
    electrical:
      drive_high_voltage_V: 2.62
      source_impedance_ohm: 82.5
  GPIO1:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  SWCLK:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  SWDIO:
    kind: digital_electrical_io
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      drive_high_voltage_V: 2.62
      source_impedance_ohm: 82.5
      injection_current_limit_A: 0.0001
  USB_DP:
    kind: passive
    required: false
  USB_DM:
    kind: passive
    required: false
  XIN:
    kind: passive
    required: false
  XOUT:
    kind: passive
    required: false
power_conversion:
  input_pin: VREG_VIN
  output_pin: VREG_VOUT
  max_output_current_A: 0.1
behavior:
  reset:
    pin: RUN
    active: low
  boot:
    sample_time_after_reset_release_us: 0
    modes:
      external_flash:
        straps:
          - pin: QSPI_SS
            required_state: high
      bootsel_usb:
        straps:
          - pin: QSPI_SS
            required_state: low
rules:
  - POWER_TREE_VALID
  - RESET_RELEASE_AFTER_POWER_VALID
  - BOOT_STRAP_DEFINED
  - BOOT_STRAP_BIAS_VALID
