      - spice_name: A2_STATE
        component_parameter: observation_2a_state
        default_value: 0.0
    valid_operating_notes:
      - Reduced behavioral observation model for preliminary VCC, 1A/2A input-state, and non-inverted 1Y/2Y output-state checks.
      - Uses source-backed 1.65 V to 5.5 V VCC range, dual non-inverting Schmitt-trigger buffer topology, and pinout while emitting ideal board-facing static logic levels.
      - Schmitt thresholds/hysteresis, propagation delay, rise/fall time, capacitive loading, output drive current, package parasitics, signal integrity, and final switching sign-off are out of scope.
