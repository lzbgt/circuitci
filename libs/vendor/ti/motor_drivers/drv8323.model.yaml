      - spice_name: SOC_V
        component_parameter: observation_soc_v
        default_value: 1.65
    valid_operating_notes:
      - Reduced behavioral observation model for preliminary VM/DVDD/ENABLE, nFAULT/SDO output-state, and current-sense output presence checks only.
      - Uses source-backed 6 V to 60 V VM operating range, 3 V to 5.5 V DVDD range, 2 V logic input-high threshold, output-state metadata, and three current-sense amplifier metadata while emitting ideal board-facing observation nodes.
      - MOSFET gate-drive strength, high-side/low-side outputs, charge pump/bootstrap behavior, dead time, SPI register/protection behavior, shunt gain/offset/noise, phase switching, motor dynamics, layout, and thermal sign-off are out of scope.
