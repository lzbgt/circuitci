category: rs485_transceiver
simulation:
  spice:
    model_name: CIRCUITCI_THVD1450_RS485_TRANSCEIVER
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VCC, GND, DI, RO, DE, RE_N, A, B]
    instance_parameters:
      - spice_name: DI_STATE
        component_parameter: observation_di_state
        default: 1.0
      - spice_name: DE_STATE
        component_parameter: observation_de_state
        default: 1.0
      - spice_name: RE_N_STATE
        component_parameter: observation_re_n_state
        default: 0.0
    valid_operating_notes:
      - Preliminary generated-SPICE observation face for VCC, DI, DE, RE_N, RO, and A/B line-state checks.
      - Uses source-backed supply range, pinout, logic thresholds, data-rate class, unit-load, and ESD-class metadata; behavioral line voltages are reduced design-observation placeholders.
      - Not valid for RS-485 signal integrity, termination, failsafe biasing, cable common-mode, fault energy, EMC, or IEC ESD sign-off.
