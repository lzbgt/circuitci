simulation:
  spice:
    model_name: CIRCUITCI_FT232R_USB_UART
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VCC, "3V3OUT", VCCIO, GND, TXD, RXD, RTS_N, DTR_N, RESET_N]
    instance_parameters:
      - spice_name: TXD_STATE
        component_parameter: observation_txd_state
        default_value: 1.0
      - spice_name: RTS_N_STATE
        component_parameter: observation_rts_n_state
        default_value: 1.0
      - spice_name: DTR_N_STATE
        component_parameter: observation_dtr_n_state
        default_value: 1.0
    valid_operating_notes:
      - Reduced USB-UART observation model for preliminary FT232R VCC-to-3V3OUT regulator, VCCIO-referenced TXD idle-high, and MODEM output-state checks only.
      - Uses FTDI source-backed FT232R pinout, VCC/VCCIO/3V3OUT rail limits, 3.3 V standard-drive VOH minimum, and conservative output source impedance.
      - USB PHY behavior, enumeration, EEPROM/CBUS programming, suspend states, oscillator accuracy, UART baud timing, regulator stability, modem-line transistor circuitry, and final I/O injection-current or thermal sign-off are out of scope.
rules:
  - UART_BOOTLOADER_SYNC
model_quality:
  source: datasheet
  confidence: medium
  intended_use:
    - board_connectivity
    - uart_bootloader_sync
    - power_tree_screening
    - regulator_static_screening
    - preliminary_gpio_backdrive_screening
    - preliminary_generated_spice_observation
  not_valid_for:
    - full_usb_phy
    - usb_protocol_or_enumeration
    - eeprom_or_cbus_configuration_signoff
    - final_io_injection_current_signoff
    - regulator_transient_or_stability_signoff
    - transistor_level_control_line_behavior
