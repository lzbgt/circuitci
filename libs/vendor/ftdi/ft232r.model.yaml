  device_parameters:
    integrated_usb_uart:
      conditions: Integrated USB full-speed transceiver, UART controller, EEPROM, USB termination resistors, clock generation, and CBUS configuration.
      unit: note
      simulation_relevance: Board validation should treat the bridge as a configurable functional block, not transistor-level USB logic.
    vccio_level_converter:
      conditions: VCCIO supplies UART and CBUS logic from 1.8 V to 5.25 V, including 3V3OUT-tied and VCC-tied designs.
      unit: note
      simulation_relevance: Supports UART level-compatibility checks when host bridge and target use different logic rails.
    reset_pin:
      conditions: RESET# is active low and may be tied to VCC or left unconnected if unused.
      unit: note
      simulation_relevance: Supports reset-net review in boards that wire the USB-UART bridge into reset circuits.
    cbus_configuration:
      conditions: CBUS pins are EEPROM-configurable, with default functions including TXLED#, RXLED#, TXDEN, PWREN#, and SLEEP#.
      unit: note
      simulation_relevance: CBUS behavior requires declared board-level intent before executable checks should infer meaning.
