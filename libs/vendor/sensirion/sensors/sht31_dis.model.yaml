simulation:
  spice:
    model_name: CIRCUITCI_SHT31_I2C_OBSERVATION
    model_type: subckt
    model_path: models/spice/sensirion/sht31_i2c_observation.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VDD, VSS, SDA, SCL, ADDR, NRESET, ALERT]
    valid_operating_notes:
      - Reduced high-impedance I2C board-observation model for preliminary VDD rail, SDA/SCL pull-up, ADDR address-select, nRESET, and ALERT-line checks.
      - Uses source-backed 2.15 V to 5.5 V VDD range, 1 MHz I2C interface class, ADDR-selected 0x44/0x45 address metadata, and documented nRESET/ALERT board-boundary guidance.
      - Humidity, temperature, compensation formulas, register protocol, I2C timing, clock stretching, alert-limit logic, heater behavior, response time, contamination, drift, self-heating, and calibration are out of scope.
