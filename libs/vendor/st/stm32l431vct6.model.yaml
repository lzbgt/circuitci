component_id: vendor.st.stm32l431vct6
version: 0.1.0
category: mcu
simulation:
  spice:
    model_name: CIRCUITCI_STM32L431_BOOT_UART_SWD_MCU
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VDD, VSS, NRST, BOOT0, PA9, PA10, PA13, PA14]
    instance_parameters:
      - spice_name: PA9_STATE
        component_parameter: observation_pa9_state
        default_value: 1.0
      - spice_name: PA13_STATE
        component_parameter: observation_pa13_state
        default_value: 1.0
    valid_operating_notes:
      - Reduced rail and board-facing line-state observation for preliminary STM32L431 boot/UART/SWD checks.
      - VDD/VSS, NRST, BOOT0, USART1 PA9/PA10, and SWD PA13/PA14 are represented.
      - Static PA9 and PA13 states are explicit Board IR component parameters.
      - Firmware execution, oscillator accuracy, reset timing, UART protocol timing, SWD protocol timing, flash programming side effects, package-pin exhaustive mapping, layout/SI, EMC, and thermal behavior are outside this model.
ports:
  VDD:
    kind: electrical_power
    required: true
    electrical:
      operating_voltage_min_V: 1.71
      operating_voltage_max_V: 3.6
      max_supply_current_A: 0.12
  VSS:
    kind: electrical_ground
    required: true
  NRST:
    kind: digital_electrical_input
    required: true
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  BOOT0:
    kind: digital_electrical_input
    required: true
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA9:
    kind: digital_electrical_output
    required: false
    electrical:
      drive_high_voltage_V: 3.3
      source_impedance_ohm: 50
  PA10:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA13:
    kind: digital_electrical_io
    required: false
    electrical:
      drive_high_voltage_V: 3.3
      source_impedance_ohm: 50
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
  PA14:
    kind: digital_electrical_input
    required: false
    electrical:
      vih_min_V: 2.0
      vil_max_V: 0.8
      injection_current_limit_A: 0.0001
