behavior:
  reset:
    pin: NRST
    active: low
    min_assert_us: 20
  boot:
    sample_time_after_reset_release_us: 100
    modes:
      rom_bootloader:
        straps:
          - pin: BOOT0
            required_state: high
      application:
        straps:
          - pin: BOOT0
            required_state: low
  bootloader:
    interfaces:
      usart1_rom:
        rx_pin: PA10
        tx_pin: PA9
        sync_byte: 127
        ack_byte: 121
rules:
  - RESET_RELEASE_AFTER_POWER_VALID
  - BOOT_STRAP_DEFINED
  - BOOT_STRAP_BIAS_VALID
  - UART_BOOTLOADER_SYNC
model_quality:
  source: datasheet
  confidence: medium
  intended_use:
    - power_sequence
    - boot_mode
    - uart_bootloader_sync
  not_valid_for:
    - transistor_level_mcu_behavior
    - exact_st_rom_protocol_timing
    - full_firmware_execution
