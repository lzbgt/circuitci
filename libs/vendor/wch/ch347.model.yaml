simulation:
  spice:
    model_name: CIRCUITCI_CH347_USB_JTAG_BRIDGE
    model_type: subckt
    model_path: models/spice/generic/analog_behavioral.lib
    provenance: datasheet_limited_generic_behavioral
    pin_order: [VCC, GND, TXD1, RXD1, TMS, TCK, TDI, TDO, TRST]
    instance_parameters:
      - spice_name: TXD1_STATE
        component_parameter: observation_txd1_state
        default_value: 1.0
      - spice_name: TMS_STATE
        component_parameter: observation_tms_state
        default_value: 1.0
      - spice_name: TCK_STATE
        component_parameter: observation_tck_state
        default_value: 0.0
      - spice_name: TDI_STATE
        component_parameter: observation_tdi_state
        default_value: 1.0
      - spice_name: TRST_STATE
        component_parameter: observation_trst_state
        default_value: 1.0
    valid_operating_notes:
      - Reduced USB-JTAG/debug-bridge observation model for preliminary CH347 VCC, UART1 TXD idle-high, and JTAG line-state checks only.
      - Uses source-backed CH347 TSSOP-20 pin roles, 3.3 V supply range, 5 V-tolerant input notes, VOH minimum, and conservative output source impedance.
      - USB PHY behavior, enumeration, driver mode selection, external clock accuracy, UART baud timing, SPI/I2C/JTAG protocol behavior, TAP state, and final I/O injection-current or timing sign-off are out of scope.
