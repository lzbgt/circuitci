  device_parameters:
    high_speed_usb_bridge:
      conditions: Provides USB high-speed bridge modes for UART, I2C, SPI, and JTAG.
      unit: note
      simulation_relevance: Board validation can bind a debug bridge without modeling USB enumeration or protocol transactions.
    jtag_mode:
      conditions: Working mode 3 exposes UART1 plus JTAG TMS, TCK, TDI, TDO, and optional TRST.
      unit: note
      simulation_relevance: Supports preliminary debug-header line-state and voltage-level observations.
    jtag_pin_roles:
      conditions: TDI, TCK, TMS, and TRST are outputs; TDO is a 5 V-tolerant input with a built-in pull-up resistor.
      unit: note
      simulation_relevance: Supports conservative direction and idle-state checks without TAP-level semantics.
    uart_idle:
      conditions: TXD1 idle state is high; RXD1 input has an integrated pull-up resistor.
      unit: note
      simulation_relevance: Helps agents reason about a combined debug-UART bridge fixture.
