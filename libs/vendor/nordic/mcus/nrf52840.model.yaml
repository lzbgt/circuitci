datasheet:
  manufacturer: Nordic Semiconductor
  part_number: nRF52840
  package: aQFN73
  polarity: arm_cortex_m4f_multiprotocol_soc
  pinout:
    VDD: A22/B1/W1/AD14/AD23 VDD supplies
    VDDH: Y2 high-voltage regulator supply
    VBUS: AD2 USB 5 V regulator input
    VSS: exposed die pad and ground pins
    nRESET: P0.18 configurable reset / GPIO / QSPI CSN
    SWDCLK: AA24 SWD clock
    SWDIO: AC24 SWD data
    P0_06: P0.06 GPIO / UART-capable digital I/O
    P0_08: P0.08 GPIO / UART-capable digital I/O
    USB_DP: AD6 USB D+
    USB_DM: AD4 USB D-
    ANT: H23 2.4 GHz RF antenna port
  electrical_characteristics:
    vdd_supply:
      conditions: Recommended operating conditions, normal-voltage supply.
      min: 1.7
      typ: 3.0
      max: 3.6
      unit: V
    vddh_supply:
