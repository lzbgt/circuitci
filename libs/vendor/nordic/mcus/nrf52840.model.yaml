      min: 2.5
      typ: 3.7
      max: 5.5
      unit: V
    vbus_supply:
      conditions: Recommended operating conditions, USB regulator input.
      min: 4.35
      typ: 5.0
      max: 5.5
      unit: V
    operating_temperature:
