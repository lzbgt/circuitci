    provenance: datasheet_limited_generic_behavioral
    pin_order: [VDD, GND, SDA, SCL]
    valid_operating_notes:
      - Reduced high-impedance AHT20 I2C environmental-sensor board-observation model for preliminary VDD rail and I2C pull-up line-state checks.
      - Uses source-backed 2.2 V to 5.5 V VDD range, 0x38 I2C address metadata, 10 kHz to 400 kHz measurement-clock guidance, and VDD-referenced SDA/SCL pull-up guidance.
      - Humidity, temperature, calibration state, command protocol, measurement timing, power-on readiness timing, self-heating, contamination, recovery processing, reflow drift, and I2C timing sign-off are out of scope.
