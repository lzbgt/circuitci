project:
  name: good_ftdi_ft232r_usb_uart_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ftdi

board:
  schematic:
    component_symbols:
      VUSB: Simulation_SPICE:VDC
      UUSB: Interface_USB:FT232R
      RTXLOAD: Device:R
      RRTSLOAD: Device:R
      RDTRLOAD: Device:R
      RRST: Device:R
    node_styles:
      component:VUSB: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UUSB: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:RTXLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RRTSLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RDTRLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RRST: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VUSB: { x: 64.0, y: 176.0 }
      component:UUSB: { x: 352.0, y: 224.0 }
      component:RTXLOAD: { x: 640.0, y: 128.0 }
      component:RRTSLOAD: { x: 640.0, y: 248.0 }
      component:RDTRLOAD: { x: 640.0, y: 368.0 }
      component:RRST: { x: 352.0, y: 432.0 }
      net:usb_5v: { x: 176.0, y: 160.0 }
      net:ft232r_3v3: { x: 176.0, y: 256.0 }
      net:uart_txd: { x: 512.0, y: 128.0 }
      net:uart_rxd: { x: 512.0, y: 192.0 }
      net:ft232r_rts_n: { x: 512.0, y: 248.0 }
      net:ft232r_dtr_n: { x: 512.0, y: 368.0 }
      net:ft232r_reset_n: { x: 352.0, y: 384.0 }
      net:gnd: { x: 352.0, y: 544.0 }
    wire_routes:
      VUSB.P->usb_5v:
        points:
          - { x: 144.0, y: 176.0 }
      VUSB.N->gnd:
        points:
          - { x: 112.0, y: 544.0 }
      UUSB.VCC->usb_5v:
        points:
          - { x: 256.0, y: 160.0 }
      UUSB.3V3OUT->ft232r_3v3:
        points:
          - { x: 256.0, y: 256.0 }
      UUSB.VCCIO->ft232r_3v3:
        points:
          - { x: 256.0, y: 256.0 }
      UUSB.GND->gnd:
        points:
          - { x: 352.0, y: 544.0 }
      UUSB.TXD->uart_txd:
        points:
          - { x: 512.0, y: 128.0 }
      UUSB.RXD->uart_rxd:
        points:
          - { x: 512.0, y: 192.0 }
      UUSB.RTS_N->ft232r_rts_n:
        points:
          - { x: 512.0, y: 248.0 }
      UUSB.DTR_N->ft232r_dtr_n:
        points:
          - { x: 512.0, y: 368.0 }
      UUSB.RESET_N->ft232r_reset_n:
        points:
          - { x: 352.0, y: 384.0 }
      RTXLOAD.A->uart_txd:
        points:
          - { x: 640.0, y: 128.0 }
      RTXLOAD.B->gnd:
        points:
          - { x: 640.0, y: 544.0 }
      RRTSLOAD.A->ft232r_rts_n:
        points:
          - { x: 640.0, y: 248.0 }
      RRTSLOAD.B->gnd:
        points:
          - { x: 640.0, y: 544.0 }
      RDTRLOAD.A->ft232r_3v3:
        points:
          - { x: 640.0, y: 256.0 }
      RDTRLOAD.B->ft232r_dtr_n:
        points:
          - { x: 640.0, y: 368.0 }
      RRST.A->usb_5v:
        points:
          - { x: 352.0, y: 160.0 }
      RRST.B->ft232r_reset_n:
        points:
          - { x: 352.0, y: 384.0 }
  components:
    VUSB:
      model: generic.analog.dc_voltage_source
      part_number: USB_5V_SOURCE
      pins:
        P: usb_5v
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5.0
    UUSB:
      model: vendor.ftdi.ft232r
      part_number: FT232RL
      parameters:
        observation_txd_state: 1.0
        observation_rts_n_state: 1.0
        observation_dtr_n_state: 0.0
      pins:
        VCC: usb_5v
        VCCIO: ft232r_3v3
        "3V3OUT": ft232r_3v3
        GND: gnd
        TXD: uart_txd
        RXD: uart_rxd
        RTS_N: ft232r_rts_n
        DTR_N: ft232r_dtr_n
        RESET_N: ft232r_reset_n
    RTXLOAD:
      model: generic.analog.resistor
      part_number: 100k
      pins:
        A: uart_txd
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 100000.0
    RRTSLOAD:
      model: generic.analog.resistor
      part_number: 100k
      pins:
        A: ft232r_rts_n
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 100000.0
    RDTRLOAD:
      model: generic.analog.resistor
      part_number: 10k_pullup
      pins:
        A: ft232r_3v3
        B: ft232r_dtr_n
      spice:
        primitive: resistor
        value_ohm: 10000.0
    RRST:
      model: generic.analog.resistor
      part_number: 10k_pullup
      pins:
        A: usb_5v
        B: ft232r_reset_n
      spice:
        primitive: resistor
        value_ohm: 10000.0
  nets:
    usb_5v:
      kind: power
      nominal_voltage: 5.0
      powered: true
      supply_current_limit_A: 0.5
    ft232r_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
      supply_current_limit_A: 0.05
    uart_txd:
      kind: digital_or_analog
    uart_rxd:
      kind: digital_or_analog
    ft232r_rts_n:
      kind: digital_or_analog
    ft232r_dtr_n:
      kind: digital_or_analog
    ft232r_reset_n:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: ft232r_usb_uart_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VUSB
          - UUSB
          - RTXLOAD
          - RRTSLOAD
          - RDTRLOAD
          - RRST
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: 50ca8875be8c3d625c59a0d53ee74b36ca5653a8f210d27416da2b55cda65a07
      node_bindings:
        - { node: vcc, net: usb_5v }
        - { node: v3v3out, net: ft232r_3v3 }
        - { node: txd, net: uart_txd }
        - { node: rxd, net: uart_rxd }
        - { node: rts_n, net: ft232r_rts_n }
        - { node: dtr_n, net: ft232r_dtr_n }
        - { node: reset_n, net: ft232r_reset_n }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vcc, endpoint: { component: VUSB, pin: P } }
        - { node: "0", endpoint: { component: VUSB, pin: N } }
        - { node: vcc, endpoint: { component: UUSB, pin: VCC } }
        - { node: v3v3out, endpoint: { component: UUSB, pin: VCCIO } }
        - { node: v3v3out, endpoint: { component: UUSB, pin: "3V3OUT" } }
        - { node: "0", endpoint: { component: UUSB, pin: GND } }
        - { node: txd, endpoint: { component: UUSB, pin: TXD } }
        - { node: rxd, endpoint: { component: UUSB, pin: RXD } }
        - { node: rts_n, endpoint: { component: UUSB, pin: RTS_N } }
        - { node: dtr_n, endpoint: { component: UUSB, pin: DTR_N } }
        - { node: reset_n, endpoint: { component: UUSB, pin: RESET_N } }
        - { node: txd, endpoint: { component: RTXLOAD, pin: A } }
        - { node: "0", endpoint: { component: RTXLOAD, pin: B } }
        - { node: rts_n, endpoint: { component: RRTSLOAD, pin: A } }
        - { node: "0", endpoint: { component: RRTSLOAD, pin: B } }
        - { node: v3v3out, endpoint: { component: RDTRLOAD, pin: A } }
        - { node: dtr_n, endpoint: { component: RDTRLOAD, pin: B } }
        - { node: vcc, endpoint: { component: RRST, pin: A } }
        - { node: reset_n, endpoint: { component: RRST, pin: B } }
      analysis:
        type: tran
        stop_time_us: 60.0
        max_step_us: 0.2
      stimuli:
        - name: host_line_snapshot
          description: FT232R VCC powers its 3V3OUT/VCCIO rail while TXD and RTS# idle high and DTR# is explicitly asserted low.
      probes:
        - name: v_vcc
          expression: V(vcc)
        - name: v_3v3out
          expression: V(v3v3out)
        - name: v_txd
          expression: V(txd)
        - name: v_rts_n
          expression: V(rts_n)
        - name: v_dtr_n
          expression: V(dtr_n)
      assertions:
        - name: vcc_within_input_range_min
          probe: v_vcc
          aggregation: min
          start_us: 1.0
          end_us: 60.0
          relation: above
          threshold_v: 4.0
        - name: vcc_within_input_range_max
          probe: v_vcc
          aggregation: max
          start_us: 1.0
          end_us: 60.0
          relation: below
          threshold_v: 5.25
        - name: v3v3out_regulated_min
          probe: v_3v3out
          aggregation: min
          start_us: 1.0
          end_us: 60.0
          relation: above
          threshold_v: 3.0
        - name: v3v3out_regulated_max
          probe: v_3v3out
          aggregation: max
          start_us: 1.0
          end_us: 60.0
          relation: below
          threshold_v: 3.6
        - name: txd_idle_high
          probe: v_txd
          aggregation: mean
          start_us: 1.0
          end_us: 60.0
          relation: above
          threshold_v: 2.2
        - name: rts_n_idle_high
          probe: v_rts_n
          aggregation: mean
          start_us: 1.0
          end_us: 60.0
          relation: above
          threshold_v: 2.2
        - name: dtr_n_asserted_low
          probe: v_dtr_n
          aggregation: mean
          start_us: 1.0
          end_us: 60.0
          relation: below
          threshold_v: 0.5
