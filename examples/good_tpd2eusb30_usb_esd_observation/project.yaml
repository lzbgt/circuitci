project:
  name: good_tpd2eusb30_usb_esd_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/protection

board:
  schematic:
    component_symbols:
      VDP: Simulation_SPICE:VDC
      VDM: Simulation_SPICE:VDC
      UESD: Interface_USB:TPD2EUSB30
    node_styles:
      component:VDP: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VDM: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UESD: { rotation_deg: 0, mirrored: false, pin_side: auto }
    node_positions:
      component:VDP: { x: 64.0, y: 160.0 }
      component:VDM: { x: 64.0, y: 320.0 }
      component:UESD: { x: 352.0, y: 240.0 }
      net:usb_dp: { x: 208.0, y: 160.0 }
      net:usb_dm: { x: 208.0, y: 320.0 }
      net:gnd: { x: 352.0, y: 480.0 }
    wire_routes:
      VDP.P->usb_dp:
        points:
          - { x: 160.0, y: 176.0 }
      VDP.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      VDM.P->usb_dm:
        points:
          - { x: 160.0, y: 336.0 }
      VDM.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      UESD.D1+->usb_dp:
        points:
          - { x: 288.0, y: 176.0 }
      UESD.D1-->usb_dm:
        points:
          - { x: 288.0, y: 336.0 }
      UESD.GND->gnd:
        points:
          - { x: 352.0, y: 480.0 }
  components:
    VDP:
      model: generic.analog.dc_voltage_source
      pins:
        P: usb_dp
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.3
    VDM:
      model: generic.analog.dc_voltage_source
      pins:
        P: usb_dm
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 0.0
    UESD:
      model: vendor.ti.tpd2eusb30
      part_number: TPD2EUSB30DRTR
      pins:
        "D1+": usb_dp
        "D1-": usb_dm
        GND: gnd
  nets:
    usb_dp:
      kind: power
      nominal_voltage: 3.3
      powered: true
    usb_dm:
      kind: power
      nominal_voltage: 0.0
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: tpd2eusb30_usb_esd_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VDP
          - VDM
          - UESD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: 6d841faf008cc5df52d9d09e7e2ee3cf1a48cfaea25f3d109d605403d778dc19
      node_bindings:
        - { node: dp, net: usb_dp }
        - { node: dm, net: usb_dm }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: dp, endpoint: { component: VDP, pin: P } }
        - { node: "0", endpoint: { component: VDP, pin: N } }
        - { node: dm, endpoint: { component: VDM, pin: P } }
        - { node: "0", endpoint: { component: VDM, pin: N } }
        - { node: dp, endpoint: { component: UESD, pin: "D1+" } }
        - { node: dm, endpoint: { component: UESD, pin: "D1-" } }
        - { node: "0", endpoint: { component: UESD, pin: GND } }
      analysis:
        type: tran
        stop_time_us: 20.0
        max_step_us: 0.1
      stimuli:
        - name: normal_usb_line_standoff
          description: TPD2EUSB30 observes normal USB data-line voltages below the 5.5 V standoff limit with datasheet typical line capacitance.
      probes:
        - name: v_dp
          expression: V(dp)
        - name: v_dm
          expression: V(dm)
        - name: i_dp_source
          expression: I(VDP)
          quantity: current
        - name: i_dm_source
          expression: I(VDM)
          quantity: current
      assertions:
        - name: dp_below_standoff
          probe: v_dp
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 5.5
        - name: dm_below_standoff
          probe: v_dm
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 5.5
        - name: dp_normal_high_level
          probe: v_dp
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: above
          threshold_v: 3.0
        - name: dm_normal_low_level
          probe: v_dm
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 0.1
