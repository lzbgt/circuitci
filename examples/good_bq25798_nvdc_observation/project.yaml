project:
  name: good_bq25798_nvdc_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/chargers

board:
  schematic:
    component_symbols:
      VBUS: Simulation_SPICE:VDC
      UCHG: Battery_Management:BQ25798
      VSENSE: Simulation_SPICE:VDC
      CBAT: Device:C
      RLOAD: Device:R
    node_styles:
      component:VBUS: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UCHG: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:VSENSE: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:CBAT: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VBUS: { x: 64.0, y: 224.0 }
      component:UCHG: { x: 320.0, y: 224.0 }
      component:VSENSE: { x: 496.0, y: 192.0 }
      component:CBAT: { x: 640.0, y: 288.0 }
      component:RLOAD: { x: 640.0, y: 432.0 }
      net:adapter_20v: { x: 176.0, y: 176.0 }
      net:sys_out: { x: 496.0, y: 320.0 }
      net:charge_out: { x: 432.0, y: 176.0 }
      net:battery: { x: 592.0, y: 176.0 }
      net:gnd: { x: 352.0, y: 560.0 }
    wire_routes:
      VBUS.P->adapter_20v:
        points:
          - { x: 160.0, y: 192.0 }
      VBUS.N->gnd:
        points:
          - { x: 112.0, y: 560.0 }
      UCHG.VBUS->adapter_20v:
        points:
          - { x: 240.0, y: 192.0 }
      UCHG.SYS->sys_out:
        points:
          - { x: 496.0, y: 320.0 }
      UCHG.BAT->charge_out:
        points:
          - { x: 432.0, y: 176.0 }
      UCHG.GND->gnd:
        points:
          - { x: 320.0, y: 560.0 }
      VSENSE.P->charge_out:
        points:
          - { x: 464.0, y: 176.0 }
      VSENSE.N->battery:
        points:
          - { x: 592.0, y: 176.0 }
      CBAT.A->battery:
        points:
          - { x: 688.0, y: 176.0 }
      CBAT.B->gnd:
        points:
          - { x: 688.0, y: 560.0 }
      RLOAD.A->sys_out:
        points:
          - { x: 688.0, y: 320.0 }
      RLOAD.B->gnd:
        points:
          - { x: 688.0, y: 560.0 }
  components:
    VBUS:
      model: generic.analog.dc_voltage_source
      part_number: ADAPTER_20V_SOURCE
      pins:
        P: adapter_20v
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 20.0
    UCHG:
      model: vendor.ti.bq25798
      part_number: BQ25798
      parameters:
        programmed_charge_current_A: 2.0
        observation_system_voltage_V: 12.0
      power_domains:
        VBUS: adapter_20v
        SYS: sys_out
        BAT: charge_out
      pins:
        VBUS: adapter_20v
        SYS: sys_out
        BAT: charge_out
        GND: gnd
    VSENSE:
      model: generic.analog.dc_voltage_source
      pins:
        P: charge_out
        N: battery
      spice:
        primitive: dc_voltage_source
        dc_v: 0.0
    CBAT:
      model: generic.analog.capacitor
      pins:
        A: battery
        B: gnd
      spice:
        primitive: capacitor
        value_f: 0.001
        initial_v: 11.0
    RLOAD:
      model: generic.analog.resistor
      part_number: 24R_1pct
      pins:
        A: sys_out
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 24.0
  nets:
    adapter_20v:
      kind: power
      nominal_voltage: 20.0
      powered: true
      supply_current_limit_A: 3.0
    sys_out:
      kind: power
      nominal_voltage: 12.0
      powered: true
    charge_out:
      kind: power
      nominal_voltage: 16.8
      powered: true
    battery:
      kind: power
      nominal_voltage: 16.8
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: bq25798_nvdc_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VBUS
          - UCHG
          - VSENSE
          - CBAT
          - RLOAD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: c9582b919ee962c470a108c33570b5e49f8ebd243c23a461f9851beb1d8e499f
      node_bindings:
        - { node: adapter, net: adapter_20v }
        - { node: sysout, net: sys_out }
        - { node: charge, net: charge_out }
        - { node: battery, net: battery }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: adapter, endpoint: { component: VBUS, pin: P } }
        - { node: "0", endpoint: { component: VBUS, pin: N } }
        - { node: adapter, endpoint: { component: UCHG, pin: VBUS } }
        - { node: sysout, endpoint: { component: UCHG, pin: SYS } }
        - { node: charge, endpoint: { component: UCHG, pin: BAT } }
        - { node: "0", endpoint: { component: UCHG, pin: GND } }
        - { node: charge, endpoint: { component: VSENSE, pin: P } }
        - { node: battery, endpoint: { component: VSENSE, pin: N } }
        - { node: battery, endpoint: { component: CBAT, pin: A } }
        - { node: "0", endpoint: { component: CBAT, pin: B } }
        - { node: sysout, endpoint: { component: RLOAD, pin: A } }
        - { node: "0", endpoint: { component: RLOAD, pin: B } }
      analysis:
        type: tran
        stop_time_us: 600.0
        max_step_us: 1.0
      stimuli:
        - name: adapter_nvdc_charge
          description: 20 V adapter source feeds a reduced BQ25798 NVDC charger observation model with 2 A programmed charge current, 12 V SYS target, 24 ohm system load, and 1 mF battery-node capacitor initially at 11 V.
      probes:
        - name: v_adapter
          expression: V(adapter)
        - name: v_sysout
          expression: V(sysout)
        - name: v_bat
          expression: V(battery)
        - name: i_charge
          expression: I(VSENSE)
          quantity: current
        - name: i_sys_load
          expression: I(VCCI_RLOAD)
          quantity: current
      assertions:
        - name: system_out_above_11p9v
          probe: v_sysout
          aggregation: min
          start_us: 1.0
          end_us: 590.0
          relation: above
          threshold_v: 11.9
        - name: system_out_below_12p1v
          probe: v_sysout
          aggregation: max
          start_us: 1.0
          end_us: 590.0
          relation: below
          threshold_v: 12.1
        - name: charge_current_above_1p9a
          probe: i_charge
          aggregation: mean
          start_us: 20.0
          end_us: 300.0
          relation: above
          threshold_a: 1.9
        - name: charge_current_below_2p1a
          probe: i_charge
          aggregation: mean
          start_us: 20.0
          end_us: 300.0
          relation: below
          threshold_a: 2.1
        - name: battery_rises_above_11p5v
          probe: v_bat
          aggregation: rising_crossing_time
          start_us: 1.0
          end_us: 590.0
          threshold_v: 11.5
          time_limit_us: 350.0
          relation: below
        - name: battery_below_observation_window
          probe: v_bat
          aggregation: max
          start_us: 1.0
          end_us: 590.0
          relation: below
          threshold_v: 12.3
        - name: system_load_current_near_500ma
          probe: i_sys_load
          aggregation: mean
          start_us: 20.0
          end_us: 590.0
          relation: below
          threshold_a: 0.51
