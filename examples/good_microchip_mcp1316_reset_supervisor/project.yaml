project:
  name: good_microchip_mcp1316_reset_supervisor
  version: 0.1.0

libraries:
  - ../../libs/generic
  - ../../libs/vendor

board:
  components:
    U1:
      model: generic.mcu.basic
      part_number: GENERIC_MCU
      power_domains:
        VDD: rail_3v3
      pins:
        VDD: rail_3v3
        GND: gnd
        NRST: nrst
    USUP:
      model: vendor.microchip.mcp1316t_29le_ot
      part_number: MCP1316T-29LE/OT
      power_domains:
        VDD: rail_3v3
      pins:
        VDD: rail_3v3
        VSS: gnd
        RST_N: nrst
        MR_N: rail_3v3
        WDI: watchdog_kick
  nets:
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
      power_valid_at_us: 1000
    nrst:
      kind: digital_or_analog
    watchdog_kick:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: mcp1316_reset_supervisor_threshold
    type: power_tree
    checks:
      - POWER_TREE_VALID
