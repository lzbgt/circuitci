        observation_pwm_uh_state: 1.0
        observation_pwm_ul_state: 0.0
        observation_pwm_vh_state: 0.0
        observation_pwm_vl_state: 1.0
        observation_pwm_wh_state: 0.0
        observation_pwm_wl_state: 0.0
        observation_drv_en_state: 1.0
        observation_drv_nfault_state: 1.0
        observation_drv_spi_sck_state: 0.0
        observation_drv_spi_mosi_state: 0.0
        observation_drv_spi_miso_state: 1.0
        observation_drv_spi_cs_state: 1.0
        observation_enc_a_state: 1.0
        observation_enc_b_state: 0.0
        observation_enc_z_state: 0.0
        observation_enable_in_state: 1.0
        observation_fault_out_state: 0.0
      power_domains:
        VDD: vdd_3v3
      pins:
