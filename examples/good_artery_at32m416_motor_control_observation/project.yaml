    pwm_uh: { kind: digital_or_analog, nominal_voltage: 3.3 }
    pwm_ul: { kind: digital_or_analog, nominal_voltage: 0.0 }
    pwm_vh: { kind: digital_or_analog, nominal_voltage: 0.0 }
    pwm_vl: { kind: digital_or_analog, nominal_voltage: 3.3 }
    pwm_wh: { kind: digital_or_analog, nominal_voltage: 0.0 }
    pwm_wl: { kind: digital_or_analog, nominal_voltage: 0.0 }
    drv_en: { kind: digital_or_analog, nominal_voltage: 3.3 }
    drv_nfault: { kind: power, nominal_voltage: 3.3, powered: true }
    drv_spi_sck: { kind: digital_or_analog, nominal_voltage: 0.0 }
    drv_spi_mosi: { kind: digital_or_analog, nominal_voltage: 0.0 }
    drv_spi_miso: { kind: power, nominal_voltage: 3.3, powered: true }
    drv_spi_cs: { kind: digital_or_analog, nominal_voltage: 3.3 }
    cur_u: { kind: power, nominal_voltage: 1.65, powered: true }
    cur_v: { kind: power, nominal_voltage: 1.65, powered: true }
    cur_w: { kind: power, nominal_voltage: 1.65, powered: true }
    enc_a: { kind: power, nominal_voltage: 3.3, powered: true }
    enc_b: { kind: power, nominal_voltage: 0.0, powered: true }
    enc_z: { kind: power, nominal_voltage: 0.0, powered: true }
    enable_in: { kind: power, nominal_voltage: 3.3, powered: true }
    fault_out: { kind: digital_or_analog, nominal_voltage: 0.0 }
    gnd: { kind: ground }

scenarios:
  - name: at32m416_motor_control_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VDD
          - VCANRX
          - VDRVFAULT
          - VMISO
          - VCURU
          - VCURV
          - VCURW
          - VENCA
          - VENCB
          - VENCZ
          - VENABLE
          - UMCU
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: ad5aec2585e6d9803b3b6f7930c19148e252c1cf4362b550893e85afdd025e59
      node_bindings:
        - { node: vdd, net: vdd_3v3 }
        - { node: can_tx, net: can_tx }
        - { node: can_rx, net: can_rx }
        - { node: pwm_uh, net: pwm_uh }
        - { node: pwm_ul, net: pwm_ul }
        - { node: pwm_vh, net: pwm_vh }
        - { node: pwm_vl, net: pwm_vl }
        - { node: pwm_wh, net: pwm_wh }
        - { node: pwm_wl, net: pwm_wl }
        - { node: drv_en, net: drv_en }
        - { node: drv_nfault, net: drv_nfault }
        - { node: drv_spi_sck, net: drv_spi_sck }
        - { node: drv_spi_mosi, net: drv_spi_mosi }
        - { node: drv_spi_miso, net: drv_spi_miso }
        - { node: drv_spi_cs, net: drv_spi_cs }
        - { node: cur_u, net: cur_u }
        - { node: cur_v, net: cur_v }
        - { node: cur_w, net: cur_w }
        - { node: enc_a, net: enc_a }
        - { node: enc_b, net: enc_b }
        - { node: enc_z, net: enc_z }
        - { node: enable_in, net: enable_in }
        - { node: fault_out, net: fault_out }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vdd, endpoint: { component: VDD, pin: P } }
        - { node: "0", endpoint: { component: VDD, pin: N } }
        - { node: can_rx, endpoint: { component: VCANRX, pin: P } }
        - { node: "0", endpoint: { component: VCANRX, pin: N } }
        - { node: drv_nfault, endpoint: { component: VDRVFAULT, pin: P } }
        - { node: "0", endpoint: { component: VDRVFAULT, pin: N } }
        - { node: drv_spi_miso, endpoint: { component: VMISO, pin: P } }
        - { node: "0", endpoint: { component: VMISO, pin: N } }
        - { node: cur_u, endpoint: { component: VCURU, pin: P } }
        - { node: "0", endpoint: { component: VCURU, pin: N } }
        - { node: cur_v, endpoint: { component: VCURV, pin: P } }
        - { node: "0", endpoint: { component: VCURV, pin: N } }
        - { node: cur_w, endpoint: { component: VCURW, pin: P } }
        - { node: "0", endpoint: { component: VCURW, pin: N } }
        - { node: enc_a, endpoint: { component: VENCA, pin: P } }
        - { node: "0", endpoint: { component: VENCA, pin: N } }
        - { node: enc_b, endpoint: { component: VENCB, pin: P } }
        - { node: "0", endpoint: { component: VENCB, pin: N } }
        - { node: enc_z, endpoint: { component: VENCZ, pin: P } }
        - { node: "0", endpoint: { component: VENCZ, pin: N } }
        - { node: enable_in, endpoint: { component: VENABLE, pin: P } }
        - { node: "0", endpoint: { component: VENABLE, pin: N } }
        - { node: vdd, endpoint: { component: UMCU, pin: VDD } }
        - { node: "0", endpoint: { component: UMCU, pin: GND } }
        - { node: can_tx, endpoint: { component: UMCU, pin: CAN_TX } }
        - { node: can_rx, endpoint: { component: UMCU, pin: CAN_RX } }
        - { node: pwm_uh, endpoint: { component: UMCU, pin: PWM_UH } }
        - { node: pwm_ul, endpoint: { component: UMCU, pin: PWM_UL } }
        - { node: pwm_vh, endpoint: { component: UMCU, pin: PWM_VH } }
        - { node: pwm_vl, endpoint: { component: UMCU, pin: PWM_VL } }
        - { node: pwm_wh, endpoint: { component: UMCU, pin: PWM_WH } }
        - { node: pwm_wl, endpoint: { component: UMCU, pin: PWM_WL } }
        - { node: drv_en, endpoint: { component: UMCU, pin: DRV_EN } }
        - { node: drv_nfault, endpoint: { component: UMCU, pin: DRV_NFAULT } }
        - { node: drv_spi_sck, endpoint: { component: UMCU, pin: DRV_SPI_SCK } }
        - { node: drv_spi_mosi, endpoint: { component: UMCU, pin: DRV_SPI_MOSI } }
        - { node: drv_spi_miso, endpoint: { component: UMCU, pin: DRV_SPI_MISO } }
        - { node: drv_spi_cs, endpoint: { component: UMCU, pin: DRV_SPI_CS } }
        - { node: cur_u, endpoint: { component: UMCU, pin: CUR_U } }
        - { node: cur_v, endpoint: { component: UMCU, pin: CUR_V } }
        - { node: cur_w, endpoint: { component: UMCU, pin: CUR_W } }
        - { node: enc_a, endpoint: { component: UMCU, pin: ENC_A } }
        - { node: enc_b, endpoint: { component: UMCU, pin: ENC_B } }
        - { node: enc_z, endpoint: { component: UMCU, pin: ENC_Z } }
        - { node: enable_in, endpoint: { component: UMCU, pin: ENABLE_IN } }
        - { node: fault_out, endpoint: { component: UMCU, pin: FAULT_OUT } }
      analysis:
        type: tran
        stop_time_us: 100.0
        max_step_us: 0.2
      stimuli:
        - name: motor_control_ready_driver_clear
          description: 3.3 V AT32M416 motor-control MCU with driver, CAN, encoder, and control lines in idle/ready states.
      probes:
        - { name: v_vdd, expression: V(vdd) }
        - { name: v_can_tx, expression: V(can_tx) }
        - { name: v_can_rx, expression: V(can_rx) }
        - { name: v_pwm_uh, expression: V(pwm_uh) }
        - { name: v_pwm_ul, expression: V(pwm_ul) }
        - { name: v_pwm_vh, expression: V(pwm_vh) }
        - { name: v_pwm_vl, expression: V(pwm_vl) }
        - { name: v_pwm_wh, expression: V(pwm_wh) }
        - { name: v_pwm_wl, expression: V(pwm_wl) }
        - { name: v_drv_en, expression: V(drv_en) }
        - { name: v_drv_nfault, expression: V(drv_nfault) }
        - { name: v_drv_spi_sck, expression: V(drv_spi_sck) }
        - { name: v_drv_spi_mosi, expression: V(drv_spi_mosi) }
        - { name: v_drv_spi_miso, expression: V(drv_spi_miso) }
        - { name: v_drv_spi_cs, expression: V(drv_spi_cs) }
        - { name: v_cur_u, expression: V(cur_u) }
        - { name: v_cur_v, expression: V(cur_v) }
        - { name: v_cur_w, expression: V(cur_w) }
        - { name: v_enc_a, expression: V(enc_a) }
        - { name: v_enc_b, expression: V(enc_b) }
        - { name: v_enc_z, expression: V(enc_z) }
        - { name: v_enable_in, expression: V(enable_in) }
        - { name: v_fault_out, expression: V(fault_out) }
      assertions:
        - { name: vdd_above_min, probe: v_vdd, aggregation: min, start_us: 0.0, end_us: 100.0, relation: above, threshold_v: 2.6 }
        - { name: vdd_below_max, probe: v_vdd, aggregation: max, start_us: 0.0, end_us: 100.0, relation: below, threshold_v: 3.6 }
        - { name: can_tx_idle_high, probe: v_can_tx, aggregation: mean, start_us: 0.0, end_us: 100.0, relation: above, threshold_v: 2.3 }
        - { name: can_rx_recessive_high, probe: v_can_rx, aggregation: mean, start_us: 0.0, end_us: 100.0, relation: above, threshold_v: 2.0 }
        - { name: pwm_uh_drive_high, probe: v_pwm_uh, aggregation: mean, start_us: 0.0, end_us: 100.0, relation: above, threshold_v: 2.3 }
        - { name: pwm_ul_drive_low, probe: v_pwm_ul, aggregation: mean, start_us: 0.0, end_us: 100.0, relation: below, threshold_v: 0.8 }
        - { name: pwm_vh_drive_low, probe: v_pwm_vh, aggregation: mean, start_us: 0.0, end_us: 100.0, relation: below, threshold_v: 0.8 }
