project:
  name: good_tps22918_load_switch_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/load_switches

board:
  schematic:
    component_symbols:
      VUSB: Simulation_SPICE:VDC
      VON: Simulation_SPICE:VDC
      USW: Power_Management:TPS22918
      RLOAD: Device:R
    node_styles:
      component:VUSB: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VON: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:USW: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:RLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VUSB: { x: 64.0, y: 176.0 }
      component:VON: { x: 64.0, y: 320.0 }
      component:USW: { x: 320.0, y: 224.0 }
      component:RLOAD: { x: 560.0, y: 320.0 }
      net:usb_5v: { x: 176.0, y: 176.0 }
      net:switch_on: { x: 176.0, y: 320.0 }
      net:switched_5v: { x: 464.0, y: 176.0 }
      net:gnd: { x: 320.0, y: 512.0 }
    wire_routes:
      VUSB.P->usb_5v:
        points:
          - { x: 160.0, y: 192.0 }
      VUSB.N->gnd:
        points:
          - { x: 112.0, y: 512.0 }
      VON.P->switch_on:
        points:
          - { x: 160.0, y: 336.0 }
      VON.N->gnd:
        points:
          - { x: 112.0, y: 512.0 }
      USW.VIN->usb_5v:
        points:
          - { x: 240.0, y: 192.0 }
      USW.ON->switch_on:
        points:
          - { x: 240.0, y: 336.0 }
      USW.VOUT->switched_5v:
        points:
          - { x: 480.0, y: 192.0 }
      USW.GND->gnd:
        points:
          - { x: 320.0, y: 512.0 }
      RLOAD.A->switched_5v:
        points:
          - { x: 608.0, y: 192.0 }
      RLOAD.B->gnd:
        points:
          - { x: 608.0, y: 512.0 }
  components:
    VUSB:
      model: generic.analog.dc_voltage_source
      pins:
        P: usb_5v
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5.0
    VON:
      model: generic.analog.dc_voltage_source
      pins:
        P: switch_on
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5.0
    USW:
      model: vendor.ti.tps22918
      part_number: TPS22918DBVR
      power_domains:
        VIN: usb_5v
        VOUT: switched_5v
      pins:
        VIN: usb_5v
        VOUT: switched_5v
        GND: gnd
        ON: switch_on
    RLOAD:
      model: generic.analog.resistor
      pins:
        A: switched_5v
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 1000.0
  nets:
    usb_5v:
      kind: power
      nominal_voltage: 5.0
      powered: true
    switched_5v:
      kind: power
      nominal_voltage: 5.0
      powered: true
    switch_on:
      kind: power
    gnd:
      kind: ground

scenarios:
  - name: tps22918_enabled_load_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VUSB
          - VON
          - USW
          - RLOAD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: ad5aec2585e6d9803b3b6f7930c19148e252c1cf4362b550893e85afdd025e59
      node_bindings:
        - { node: vusb, net: usb_5v }
        - { node: on, net: switch_on }
        - { node: switched5v, net: switched_5v }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vusb, endpoint: { component: VUSB, pin: P } }
        - { node: "0", endpoint: { component: VUSB, pin: N } }
        - { node: on, endpoint: { component: VON, pin: P } }
        - { node: "0", endpoint: { component: VON, pin: N } }
        - { node: vusb, endpoint: { component: USW, pin: VIN } }
        - { node: switched5v, endpoint: { component: USW, pin: VOUT } }
        - { node: "0", endpoint: { component: USW, pin: GND } }
        - { node: on, endpoint: { component: USW, pin: ON } }
        - { node: switched5v, endpoint: { component: RLOAD, pin: A } }
        - { node: "0", endpoint: { component: RLOAD, pin: B } }
      analysis:
        type: tran
        stop_time_us: 50.0
        max_step_us: 0.2
      stimuli:
        - name: enabled_load_switch
          description: 5 V input and ON sources enable TPS22918 behavioral load switch into a 1 kOhm load.
      probes:
        - name: v_usb
          expression: V(vusb)
        - name: v_on
          expression: V(on)
        - name: v_switched5v
          expression: V(switched5v)
        - name: i_load
          expression: I(VCCI_RLOAD)
          quantity: current
      assertions:
        - name: switched_rail_above_4p9v
          probe: v_switched5v
          aggregation: min
          start_us: 5.0
          end_us: 50.0
          relation: above
          threshold_v: 4.9
        - name: switched_rail_below_5p1v
          probe: v_switched5v
          aggregation: max
          start_us: 5.0
          end_us: 50.0
          relation: below
          threshold_v: 5.1
        - name: load_current_not_over_5p2ma
          probe: i_load
          aggregation: mean
          start_us: 5.0
          end_us: 50.0
          relation: below
          threshold_a: 0.0052
        - name: load_current_not_under_4p8ma
          probe: i_load
          aggregation: mean
          start_us: 5.0
          end_us: 50.0
          relation: above
          threshold_a: 0.0048
