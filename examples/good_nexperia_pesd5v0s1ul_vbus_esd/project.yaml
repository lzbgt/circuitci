project:
  name: good_nexperia_pesd5v0s1ul_vbus_esd
  version: 0.1.0

libraries:
  - ../../libs/vendor/nexperia/protection

board:
  components:
    UVBUS:
      model: vendor.nexperia.pesd5v0s1ul
      part_number: PESD5V0S1UL
      pins:
        K: usb_vbus
        A: gnd
  nets:
    usb_vbus:
      kind: power
      nominal_voltage: 5.0
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: pesd5v0s1ul_vbus_static_review
    type: interface_protection
    checks:
      - INTERFACE_PROTECTION_REVIEW
    target:
      component: UVBUS
    parameters:
      clamp: vbus_to_ground
      max_line_capacitance_F: 250.0e-12
