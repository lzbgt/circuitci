project:
  name: scenario_suggestions_adjacent_plane_return_path
  version: 0.1.0
libraries: []
board:
  components: {}
  nets:
    SIG:
      kind: digital_or_analog
    GND:
      kind: ground
  layout:
    stackup:
      layers:
        - name: F.Cu
          kind: signal
          source: reviewed_stackup
        - name: prepreg_1
          kind: dielectric
          source: reviewed_stackup
        - name: In1.Cu
          kind: plane
          reference_net: GND
          source: reviewed_stackup
    routes:
      SIG:
        segments:
          - start: { x_mm: 1.0, y_mm: 1.0 }
            end: { x_mm: 9.0, y_mm: 1.0 }
            width_mm: 0.15
            layer: F.Cu
    zones:
      GND:
        - layer: In1.Cu
          polygon:
            - { x_mm: 0.0, y_mm: 0.0 }
            - { x_mm: 10.0, y_mm: 0.0 }
            - { x_mm: 10.0, y_mm: 2.0 }
            - { x_mm: 0.0, y_mm: 2.0 }
