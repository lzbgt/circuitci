project:
  name: good_microchip_atecc608a_i2c_secure_element_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor

board:
  schematic:
    component_symbols:
      VCC: Simulation_SPICE:VDC
      USEC: Security:ATECC608A
      RSDA: Device:R
      RSCL: Device:R
    node_styles:
      component:VCC: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:USEC: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:RSDA: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RSCL: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VCC: { x: 96.0, y: 168.0 }
      component:USEC: { x: 380.0, y: 288.0 }
      component:RSDA: { x: 720.0, y: 176.0 }
      component:RSCL: { x: 720.0, y: 288.0 }
      net:secure_3v3: { x: 232.0, y: 96.0 }
      net:i2c_sda: { x: 612.0, y: 176.0 }
      net:i2c_scl: { x: 612.0, y: 288.0 }
      net:gnd: { x: 380.0, y: 512.0 }
    wire_routes:
      VCC.P->secure_3v3:
        points:
          - { x: 176.0, y: 168.0 }
          - { x: 232.0, y: 96.0 }
      VCC.N->gnd:
        points:
          - { x: 136.0, y: 512.0 }
      USEC.VCC->secure_3v3:
        points:
          - { x: 300.0, y: 176.0 }
          - { x: 232.0, y: 96.0 }
      USEC.GND->gnd:
        points:
          - { x: 380.0, y: 512.0 }
      USEC.SDA->i2c_sda:
        points:
          - { x: 612.0, y: 176.0 }
      USEC.SCL->i2c_scl:
        points:
          - { x: 612.0, y: 288.0 }
      RSDA.A->secure_3v3:
        points:
          - { x: 720.0, y: 96.0 }
          - { x: 232.0, y: 96.0 }
      RSDA.B->i2c_sda:
        points:
          - { x: 720.0, y: 176.0 }
      RSCL.A->secure_3v3:
        points:
          - { x: 720.0, y: 96.0 }
          - { x: 232.0, y: 96.0 }
      RSCL.B->i2c_scl:
        points:
          - { x: 720.0, y: 288.0 }
  components:
    VCC:
      model: generic.analog.dc_voltage_source
      part_number: SECURE_3V3_SOURCE
      pins:
        P: secure_3v3
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.3
    USEC:
      model: vendor.microchip.atecc608a
      part_number: ATECC608A-SSHDA-T
      parameters:
        observation_sda_state: 1.0
        observation_scl_state: 1.0
      power_domains:
        VCC: secure_3v3
      pins:
        VCC: secure_3v3
        GND: gnd
        SDA: i2c_sda
        SCL: i2c_scl
    RSDA:
      model: generic.analog.resistor
      part_number: 4.7k
      pins:
        A: secure_3v3
        B: i2c_sda
      spice:
        primitive: resistor
        value_ohm: 4700.0
    RSCL:
      model: generic.analog.resistor
      part_number: 4.7k
      pins:
        A: secure_3v3
        B: i2c_scl
      spice:
        primitive: resistor
        value_ohm: 4700.0
  nets:
    secure_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
      supply_current_limit_A: 0.05
    gnd:
      kind: ground
    i2c_sda:
      kind: digital_or_analog
      nominal_voltage: 3.3
    i2c_scl:
      kind: digital_or_analog
      nominal_voltage: 3.3

scenarios:
  - name: atecc608a_i2c_secure_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VCC
          - USEC
          - RSDA
          - RSCL
      model_files:
        - path: ../../models/spice/microchip/atecc608a_i2c_secure_element_observation.lib
          sha256: 914941c6bed332eafe3a8ec178350c8f2e6a35af72ab7854eb0c457e14fb872a
      node_bindings:
        - { node: vcc, net: secure_3v3 }
        - { node: sda, net: i2c_sda }
        - { node: scl, net: i2c_scl }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vcc, endpoint: { component: VCC, pin: P } }
        - { node: "0", endpoint: { component: VCC, pin: N } }
        - { node: vcc, endpoint: { component: USEC, pin: VCC } }
        - { node: "0", endpoint: { component: USEC, pin: GND } }
        - { node: sda, endpoint: { component: USEC, pin: SDA } }
        - { node: scl, endpoint: { component: USEC, pin: SCL } }
        - { node: vcc, endpoint: { component: RSDA, pin: A } }
        - { node: sda, endpoint: { component: RSDA, pin: B } }
        - { node: vcc, endpoint: { component: RSCL, pin: A } }
        - { node: scl, endpoint: { component: RSCL, pin: B } }
      analysis:
        type: tran
        stop_time_us: 40.0
        max_step_us: 0.2
      stimuli:
        - name: secure_element_idle_i2c_snapshot
          description: ATECC608A idle board bias with VCC at 3.3 V and SDA/SCL pulled high.
      probes:
        - name: v_vcc
          expression: V(vcc)
        - name: v_sda
          expression: V(sda)
        - name: v_scl
          expression: V(scl)
      assertions:
        - name: vcc_above_operating_min
          probe: v_vcc
          aggregation: min
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 2.0
        - name: vcc_below_operating_max
          probe: v_vcc
          aggregation: max
          start_us: 1.0
          end_us: 40.0
          relation: below
          threshold_v: 5.5
        - name: sda_idle_high
          probe: v_sda
          aggregation: mean
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 2.31
        - name: scl_idle_high
          probe: v_scl
          aggregation: mean
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 2.31
