project:
  name: good_ams1117_3v3_ldo_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ams/regulators

board:
  schematic:
    component_symbols:
      VUSB: Simulation_SPICE:VDC
      UREG: Regulator_Linear:AMS1117-3.3
      COUT: Device:C
      RLOAD: Device:R
    node_styles:
      component:VUSB: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UREG: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:COUT: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VUSB: { x: 64.0, y: 176.0 }
      component:UREG: { x: 304.0, y: 208.0 }
      component:COUT: { x: 512.0, y: 288.0 }
      component:RLOAD: { x: 640.0, y: 288.0 }
      net:usb_5v: { x: 176.0, y: 176.0 }
      net:rail_3v3: { x: 448.0, y: 176.0 }
      net:gnd: { x: 352.0, y: 496.0 }
    wire_routes:
      VUSB.P->usb_5v:
        points:
          - { x: 160.0, y: 192.0 }
      VUSB.N->gnd:
        points:
          - { x: 112.0, y: 512.0 }
      UREG.VIN->usb_5v:
        points:
          - { x: 240.0, y: 192.0 }
      UREG.VOUT->rail_3v3:
        points:
          - { x: 464.0, y: 192.0 }
      UREG.GND->gnd:
        points:
          - { x: 320.0, y: 512.0 }
      COUT.A->rail_3v3:
        points:
          - { x: 512.0, y: 192.0 }
      COUT.B->gnd:
        points:
          - { x: 512.0, y: 512.0 }
      RLOAD.A->rail_3v3:
        points:
          - { x: 640.0, y: 192.0 }
      RLOAD.B->gnd:
        points:
          - { x: 640.0, y: 512.0 }
  components:
    VUSB:
      model: generic.analog.dc_voltage_source
      part_number: USB_5V_SOURCE
      pins:
        P: usb_5v
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5.0
    UREG:
      model: vendor.ams.ams1117_3v3
      part_number: AMS1117-3.3
      power_domains:
        VIN: usb_5v
        VOUT: rail_3v3
      pins:
        VIN: usb_5v
        GND: gnd
        VOUT: rail_3v3
    COUT:
      model: generic.analog.capacitor
      part_number: 22uF
      pins:
        A: rail_3v3
        B: gnd
      spice:
        primitive: capacitor
        value_f: 0.000022
    RLOAD:
      model: generic.analog.resistor
      part_number: 330R
      pins:
        A: rail_3v3
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 330.0
  nets:
    usb_5v:
      kind: power
      nominal_voltage: 5.0
      powered: true
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: ams1117_3v3_ldo_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VUSB
          - UREG
          - COUT
          - RLOAD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: 393d92c2eb98a4ede8105bb719b6008734478f9109a8ba7ba81d4e5ec33e5835
      node_bindings:
        - { node: vusb, net: usb_5v }
        - { node: rail3v3, net: rail_3v3 }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vusb, endpoint: { component: VUSB, pin: P } }
        - { node: "0", endpoint: { component: VUSB, pin: N } }
        - { node: vusb, endpoint: { component: UREG, pin: VIN } }
        - { node: "0", endpoint: { component: UREG, pin: GND } }
        - { node: rail3v3, endpoint: { component: UREG, pin: VOUT } }
        - { node: rail3v3, endpoint: { component: COUT, pin: A } }
        - { node: "0", endpoint: { component: COUT, pin: B } }
        - { node: rail3v3, endpoint: { component: RLOAD, pin: A } }
        - { node: "0", endpoint: { component: RLOAD, pin: B } }
      analysis:
        type: tran
        stop_time_us: 100.0
        max_step_us: 0.2
      stimuli:
        - name: usb_input_minimum_load
          description: 5 V source drives an AMS1117-3.3 observation model with a 22 uF output capacitor and 330 ohm minimum-load resistor.
      probes:
        - name: v_usb
          expression: V(vusb)
        - name: v_rail3v3
          expression: V(rail3v3)
        - name: i_load
          expression: I(VCCI_RLOAD)
          quantity: current
      assertions:
        - name: rail_above_min
          probe: v_rail3v3
          aggregation: min
          start_us: 5.0
          end_us: 100.0
          relation: above
          threshold_v: 3.201
        - name: rail_below_max
          probe: v_rail3v3
          aggregation: max
          start_us: 5.0
          end_us: 100.0
          relation: below
          threshold_v: 3.399
        - name: load_current_not_under_9ma
          probe: i_load
          aggregation: mean
          start_us: 5.0
          end_us: 100.0
          relation: above
          threshold_a: 0.009
        - name: load_current_not_over_11ma
          probe: i_load
          aggregation: mean
          start_us: 5.0
          end_us: 100.0
          relation: below
          threshold_a: 0.011
