project:
  name: bad_aosong_aht20_vdd_overvoltage
  version: 0.1.0

libraries:
  - ../../libs/vendor

board:
  components:
    UAHT:
      model: vendor.aosong.aht20
      part_number: AHT20
      power_domains:
        VDD: rail_6v
      pins:
        VDD: rail_6v
        GND: gnd
        SDA: i2c_sda
        SCL: i2c_scl
  nets:
    rail_6v:
      kind: power
      nominal_voltage: 6.0
      powered: true
    gnd:
      kind: ground
    i2c_sda:
      kind: digital_or_analog
      nominal_voltage: 6.0
    i2c_scl:
      kind: digital_or_analog
      nominal_voltage: 6.0

scenarios:
  - name: aht20_vdd_overvoltage
    type: power_tree
    checks:
      - POWER_TREE_VALID
