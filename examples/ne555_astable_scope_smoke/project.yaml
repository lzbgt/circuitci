# Scope-ready NE555 astable-style GUI example.
#
# The original deck remains the solver source so this direct-open fixture stays
# aligned with the SPICE import smoke while using portable paths and readable
# schematic net IDs.
project:
  name: ne555_astable_scope
  version: 0.1.0

libraries:
  - ../../libs/generic/analog

board:
  schematic:
    node_positions:
      component:VCC: { x: -220.0, y: -160.0 }
      component:VOUT: { x: -220.0, y: 20.0 }
      component:RTIM: { x: 20.0, y: -20.0 }
      component:CTIM: { x: 230.0, y: 80.0 }
      component:RLOAD: { x: 20.0, y: 170.0 }
      net:vcc: { x: -20.0, y: -180.0 }
      net:out: { x: -10.0, y: 20.0 }
      net:timing: { x: 230.0, y: -20.0 }
      net:gnd: { x: 230.0, y: 210.0 }
  components:
    VCC:
      model: generic.analog.imported_spice_device
      pins:
        P: vcc
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5.0
    VOUT:
      model: generic.analog.imported_spice_device
      pins:
        P: out
        N: gnd
      spice:
        primitive: pulse_voltage_source
        pulse:
          initial_v: 0.0
          pulsed_v: 5.0
          delay_us: 0.0
          rise_us: 1.0
          fall_us: 1.0
          width_us: 326.0
          period_us: 686.0
    RTIM:
      model: generic.analog.resistor
      pins:
        A: out
        B: timing
      spice:
        primitive: resistor
        value_ohm: 10000.0
    CTIM:
      model: generic.analog.capacitor
      pins:
        A: timing
        B: gnd
      spice:
        primitive: capacitor
        value_f: 1e-8
    RLOAD:
      model: generic.analog.resistor
      pins:
        A: out
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 10000.0
  nets:
    vcc:
      kind: power
      nominal_voltage: 5.0
      powered: true
    out:
      kind: digital_or_analog
    timing:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: imported_spice_transient
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: file
      netlist: deck.cir
      model_files: []
      node_bindings:
        - { node: "0", net: gnd }
        - { node: out, net: out }
        - { node: timing, net: timing }
        - { node: vcc, net: vcc }
      pin_bindings:
        - { node: vcc, endpoint: { component: VCC, pin: P } }
        - { node: "0", endpoint: { component: VCC, pin: N } }
        - { node: out, endpoint: { component: VOUT, pin: P } }
        - { node: "0", endpoint: { component: VOUT, pin: N } }
        - { node: out, endpoint: { component: RTIM, pin: A } }
        - { node: timing, endpoint: { component: RTIM, pin: B } }
        - { node: timing, endpoint: { component: CTIM, pin: A } }
        - { node: "0", endpoint: { component: CTIM, pin: B } }
        - { node: out, endpoint: { component: RLOAD, pin: A } }
        - { node: "0", endpoint: { component: RLOAD, pin: B } }
      analysis:
        type: tran
        stop_time_us: 5000.0
        max_step_us: 2.0
      stimuli:
        - name: imported_deck_sources
          description: Stimuli are defined by independent sources in the imported SPICE deck.
      probes:
        - name: v_out
          expression: V(out)
        - name: v_timing
          expression: V(timing)
        - name: v_vcc
          expression: V(vcc)
        - name: i_vcc
          expression: I(VCC)
          quantity: current
        - name: i_vout
          expression: I(VOUT)
          quantity: current
      assertions: []
