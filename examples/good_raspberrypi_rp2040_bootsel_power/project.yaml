project:
  name: good_raspberrypi_rp2040_bootsel_power
  version: 0.1.0

libraries:
  - ../../libs/generic
  - ../../libs/vendor

board:
  components:
    URP:
      model: vendor.raspberrypi.rp2040
      part_number: RP2040
      power_domains:
        IOVDD: rail_3v3
        VREG_VIN: rail_3v3
        VREG_VOUT: core_1v1
        DVDD: core_1v1
        USB_VDD: rail_3v3
        ADC_AVDD: rail_3v3
      pins:
        IOVDD: rail_3v3
        VREG_VIN: rail_3v3
        VREG_VOUT: core_1v1
        DVDD: core_1v1
        USB_VDD: rail_3v3
        ADC_AVDD: rail_3v3
        GND: gnd
        RUN: rp_run
        QSPI_SS: qspi_ss
        GPIO0: uart0_tx
        GPIO1: uart0_rx
        SWCLK: swclk
        SWDIO: swdio
        USB_DP: usb_dp
        USB_DM: usb_dm
        XIN: xin
        XOUT: xout
    RRUN_UP:
      model: generic.analog.resistor
      part_number: 10K
      pins:
        A: rail_3v3
        B: rp_run
      spice:
        primitive: resistor
        value_ohm: 10000
    RQSPI_UP:
      model: generic.analog.resistor
      part_number: 10K
      pins:
        A: rail_3v3
        B: qspi_ss
      spice:
        primitive: resistor
        value_ohm: 10000
  nets:
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
    core_1v1:
      kind: power
      nominal_voltage: 1.1
      powered: true
    gnd:
      kind: ground
    rp_run:
      kind: digital_or_analog
    qspi_ss:
      kind: digital_or_analog
    uart0_tx:
      kind: digital_or_analog
    uart0_rx:
      kind: digital_or_analog
    swclk:
      kind: digital_or_analog
    swdio:
      kind: digital_or_analog
    usb_dp:
      kind: digital_or_analog
    usb_dm:
      kind: digital_or_analog
    xin:
      kind: digital_or_analog
    xout:
      kind: digital_or_analog

scenarios:
  - name: rp2040_static_power_tree
    type: power_tree
    checks:
      - POWER_TREE_VALID
  - name: rp2040_external_flash_boot_bias
    type: reset_boot
    target:
      component: URP
      power_pin: IOVDD
    checks:
      - BOOT_STRAP_BIAS_VALID
    required_boot_mode: external_flash
    parameters:
      max_strap_bias_current_A: 0.0001
