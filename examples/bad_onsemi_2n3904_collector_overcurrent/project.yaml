project:
  name: bad_onsemi_2n3904_collector_overcurrent
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/onsemi/discrete

board:
  components:
    VDD:
      model: generic.analog.dc_voltage_source
      pins:
        P: vdd_5v
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 5
    VBASE:
      model: generic.analog.pulse_voltage_source
      pins:
        P: base_drive
        N: gnd
      spice:
        primitive: pulse_voltage_source
        pulse:
          initial_v: 0
          pulsed_v: 5
          delay_us: 100
          rise_us: 0.1
          fall_us: 0.1
          width_us: 300
          period_us: 1000
    RBASE:
      model: generic.analog.resistor
      pins:
        A: base_drive
        B: q1_base
      spice:
        primitive: resistor
        value_ohm: 100
    RLOAD:
      model: generic.analog.resistor
      pins:
        A: vdd_5v
        B: q1_collector
      spice:
        primitive: resistor
        value_ohm: 10
    Q1:
      model: vendor.onsemi.npn_2n3904
      part_number: 2N3904
      pins:
        C: q1_collector
        B: q1_base
        E: gnd
  nets:
    vdd_5v:
      kind: power
      nominal_voltage: 5
      powered: true
    gnd:
      kind: ground
    base_drive:
      kind: digital_or_analog
    q1_base:
      kind: digital_or_analog
    q1_collector:
      kind: digital_or_analog

scenarios:
  - name: npn_2n3904_collector_overcurrent
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VDD
          - VBASE
          - RBASE
          - RLOAD
          - Q1
      model_files:
        - path: ../../models/spice/onsemi/2n3904.lib
          sha256: c1ee547fd9915ca0db5820070d6da6ea1c1c9634253bc610f37b9fb001e6fbce
      node_bindings:
        - node: vdd
          net: vdd_5v
        - node: "0"
          net: gnd
        - node: base_drive
          net: base_drive
        - node: q1b
          net: q1_base
        - node: q1c
          net: q1_collector
      pin_bindings:
        - node: vdd
          endpoint:
            component: VDD
            pin: P
        - node: "0"
          endpoint:
            component: VDD
            pin: N
        - node: q1c
          endpoint:
            component: Q1
            pin: C
        - node: q1b
          endpoint:
            component: Q1
            pin: B
        - node: "0"
          endpoint:
            component: Q1
            pin: E
      analysis:
        type: tran
        stop_time_us: 500
        max_step_us: 0.2
      stimuli:
        - name: base_turn_on
          description: 2N3904 base drive rises hard into a 10 ohm collector load.
      probes:
        - name: collector_current
          expression: abs(I(VDD))
          quantity: current
      assertions:
        - name: collector_current_reaches_fault_level
          probe: collector_current
          at_us: 250
          relation: above
          threshold_a: 0.25
