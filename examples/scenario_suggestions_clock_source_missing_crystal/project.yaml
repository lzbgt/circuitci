project:
  name: scenario_suggestions_clock_source_missing_crystal
  version: 0.1.0

libraries:
  - ../../libs/generic

board:
  components:
    U1:
      model: generic.mcu.basic
      part_number: GENERIC_MCU
      power_domains:
        VDD: rail_3v3
      pins:
        VDD: rail_3v3
        GND: gnd
        OSC_IN: osc_in
        OSC_OUT: osc_out
  nets:
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
    osc_in:
      kind: digital_or_analog
    osc_out:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios: []
