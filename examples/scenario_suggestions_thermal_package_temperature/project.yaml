project:
  version: "1"
  name: scenario_suggestions_thermal_package_temperature
libraries:
  - models
board:
  nets:
    VIN: { kind: power }
    VOUT: { kind: power }
    GND: { kind: ground }
  components:
    U1:
      model: example.thermal.package
      pins:
        IN: VIN
        OUT: VOUT
        GND: GND
  manufacturing:
    thermal_copper:
      - name: u1_regulator_loss
        component: U1
        power_loss_w: 1.4
        min_copper_area_mm2: 20.0
        source: reviewed_loss_budget_rev_a
