project:
  name: scenario_suggestions_rf_antenna_keepout
  version: "1"
libraries:
  - ../../libs/generic
board:
  components:
    ANT1:
      model: generic.analog.resistor
      pins:
        A: ANT
        B: GND
    C1:
      model: generic.analog.capacitor
      pins:
        A: ANT
        B: GND
  nets:
    ANT:
      kind: digital_or_analog
    GND:
      kind: ground
  layout:
    constraints:
      rf_antenna:
        keepouts:
          - name: chip_antenna_clearance
            antenna_net: ANT
            layer: F.Cu
            source: antenna_layout_guide_rev_a
            min_copper_clearance_mm: 1.0
            polygon:
              - { x_mm: 0.0, y_mm: 0.0 }
              - { x_mm: 10.0, y_mm: 0.0 }
              - { x_mm: 10.0, y_mm: 10.0 }
              - { x_mm: 0.0, y_mm: 10.0 }
        feed_paths:
          - name: chip_antenna_feed
            antenna_net: ANT
            feed_component: ANT1
            feed_pin: A
            matching_components: [C1]
            max_feed_route_length_mm: 10.0
            max_matching_component_distance_mm: 2.0
            source: antenna_layout_guide_rev_a
        measurements:
          - name: chip_antenna_s11_2440
            antenna_net: ANT
            frequency_mhz: 2440.0
            return_loss_db: 14.0
            measurement_method: vna_s11
            source: vna_sweep_rev_a
    placements:
      ANT1: { x_mm: 0.0, y_mm: 0.0, side: top, rotation_deg: 0.0 }
      C1: { x_mm: 1.2, y_mm: 0.0, side: top, rotation_deg: 0.0 }
    pads:
      ANT1:
        A:
          at: { x_mm: 0.0, y_mm: 0.0 }
          net: ANT
          layers: [F.Cu]
          kind: smd
          shape: rect
          size: { x_mm: 1.0, y_mm: 0.5 }
        B:
          at: { x_mm: -1.0, y_mm: 0.0 }
          net: GND
          layers: [F.Cu]
          kind: smd
          shape: rect
          size: { x_mm: 1.0, y_mm: 0.5 }
      C1:
        A:
          at: { x_mm: 1.2, y_mm: 0.0 }
          net: ANT
          layers: [F.Cu]
          kind: smd
          shape: rect
          size: { x_mm: 0.6, y_mm: 0.4 }
        B:
          at: { x_mm: 1.2, y_mm: 0.8 }
          net: GND
          layers: [F.Cu]
          kind: smd
          shape: rect
          size: { x_mm: 0.6, y_mm: 0.4 }
    routes:
      ANT:
        segments:
          - start: { x_mm: 0.0, y_mm: 0.0 }
            end: { x_mm: 8.0, y_mm: 0.0 }
            width_mm: 0.25
            layer: F.Cu
    copper:
      features:
        - at: { x_mm: 5.0, y_mm: 5.0 }
          layer: F.Cu
          polarity: dark
          net: ANT
          source_primitive: gerber_flash
          source_primitive_index: 0
          aperture: D10
          shape: circle
          size: { x_mm: 1.0, y_mm: 1.0 }
        - at: { x_mm: 12.0, y_mm: 5.0 }
          layer: F.Cu
          polarity: dark
          net: GND
          source_primitive: gerber_flash
          source_primitive_index: 1
          aperture: D11
          shape: circle
          size: { x_mm: 0.8, y_mm: 0.8 }
scenarios: []
