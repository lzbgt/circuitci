        - { node: gpb1, endpoint: { component: UIOX, pin: GPB1 } }
        - { node: gpb2, endpoint: { component: UIOX, pin: GPB2 } }
        - { node: gpb3, endpoint: { component: UIOX, pin: GPB3 } }
        - { node: gpb4, endpoint: { component: UIOX, pin: GPB4 } }
        - { node: gpb5, endpoint: { component: UIOX, pin: GPB5 } }
        - { node: gpb6, endpoint: { component: UIOX, pin: GPB6 } }
        - { node: gpb7, endpoint: { component: UIOX, pin: GPB7 } }
        - { node: vdd, endpoint: { component: RSDA, pin: A } }
        - { node: sda, endpoint: { component: RSDA, pin: B } }
        - { node: vdd, endpoint: { component: RSCL, pin: A } }
        - { node: scl, endpoint: { component: RSCL, pin: B } }
        - { node: vdd, endpoint: { component: RRESET, pin: A } }
        - { node: reset, endpoint: { component: RRESET, pin: B } }
        - { node: vdd, endpoint: { component: RINTA, pin: A } }
        - { node: inta, endpoint: { component: RINTA, pin: B } }
        - { node: vdd, endpoint: { component: RINTB, pin: A } }
        - { node: intb, endpoint: { component: RINTB, pin: B } }
        - { node: a0, endpoint: { component: RA0, pin: A } }
        - { node: "0", endpoint: { component: RA0, pin: B } }
        - { node: a1, endpoint: { component: RA1, pin: A } }
        - { node: "0", endpoint: { component: RA1, pin: B } }
        - { node: a2, endpoint: { component: RA2, pin: A } }
        - { node: "0", endpoint: { component: RA2, pin: B } }
        - { node: vdd, endpoint: { component: RGPA0, pin: A } }
        - { node: gpa0, endpoint: { component: RGPA0, pin: B } }
        - { node: gpb0, endpoint: { component: RGPB0, pin: A } }
        - { node: "0", endpoint: { component: RGPB0, pin: B } }
      analysis:
        type: tran
        stop_time_us: 40.0
        max_step_us: 0.2
      stimuli:
        - name: i2c_gpio_expander_idle_snapshot
          description: MCP23017 idle bias with SDA/SCL high, reset released, address pins low, interrupt outputs high, GPA0 high, and GPB0 low.
      probes:
        - name: v_vdd
          expression: V(vdd)
        - name: v_sda
          expression: V(sda)
        - name: v_scl
          expression: V(scl)
        - name: v_a0
          expression: V(a0)
        - name: v_a1
          expression: V(a1)
        - name: v_a2
          expression: V(a2)
        - name: v_reset
          expression: V(reset)
        - name: v_inta
          expression: V(inta)
        - name: v_intb
          expression: V(intb)
        - name: v_gpa0
          expression: V(gpa0)
        - name: v_gpb0
          expression: V(gpb0)
      assertions:
        - name: vdd_above_operating_min
          probe: v_vdd
          aggregation: min
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 1.8
        - name: vdd_below_operating_max
          probe: v_vdd
          aggregation: max
          start_us: 1.0
          end_us: 40.0
          relation: below
          threshold_v: 5.5
        - name: sda_idle_high
          probe: v_sda
          aggregation: mean
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 2.64
        - name: scl_idle_high
          probe: v_scl
          aggregation: mean
          start_us: 1.0
          end_us: 40.0
          relation: above
          threshold_v: 2.64
        - name: a0_address_low
