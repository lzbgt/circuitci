      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VDD
          - UIOX
          - RSDA
          - RSCL
          - RRESET
          - RINTA
          - RINTB
          - RA0
          - RA1
          - RA2
          - RGPA0
