project:
  name: bad_microchip_mcp1316_nominal_rail
  version: 0.1.0

libraries:
  - ../../libs/generic
  - ../../libs/vendor

board:
  components:
    U1:
      model: generic.mcu.basic
      part_number: GENERIC_MCU
      power_domains:
        VDD: rail_2v9
      pins:
        VDD: rail_2v9
        GND: gnd
        NRST: nrst
    USUP:
      model: vendor.microchip.mcp1316t_29le_ot
      part_number: MCP1316T-29LE/OT
      power_domains:
        VDD: rail_2v9
      pins:
        VDD: rail_2v9
        VSS: gnd
        RST_N: nrst
        MR_N: rail_2v9
        WDI: watchdog_kick
  nets:
    rail_2v9:
      kind: power
      nominal_voltage: 2.9
      powered: true
      power_valid_at_us: 1000
    nrst:
      kind: digital_or_analog
    watchdog_kick:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: mcp1316_threshold_above_nominal_rail
    type: power_tree
    checks:
      - POWER_TREE_VALID
