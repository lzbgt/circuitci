project:
  name: good_microchip_atecc608a_i2c_secure_element_power
  version: 0.1.0

libraries:
  - ../../libs/vendor

board:
  components:
    USEC:
      model: vendor.microchip.atecc608a
      part_number: ATECC608A-SSHDA-T
      power_domains:
        VCC: rail_3v3
      pins:
        VCC: rail_3v3
        GND: gnd
        SDA: i2c_sda
        SCL: i2c_scl
  nets:
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
    gnd:
      kind: ground
    i2c_sda:
      kind: digital_or_analog
      nominal_voltage: 3.3
    i2c_scl:
      kind: digital_or_analog
      nominal_voltage: 3.3

scenarios:
  - name: atecc608a_power_tree
    type: power_tree
    checks:
      - POWER_TREE_VALID
