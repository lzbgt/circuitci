project:
  version: "1"
  name: scenario_suggestions_thermal_copper_area
libraries:
  - ../../libs/generic
board:
  nets:
    SW: { kind: digital_or_analog }
    GND: { kind: ground }
  components:
    U1:
      model: generic.analog.resistor
      pins:
        A: SW
        B: GND
  manufacturing:
    thermal_copper:
      - name: u1_switch_heat_spreader
        component: U1
        power_loss_w: 1.2
        min_copper_area_mm2: 18.0
        layers: [F.Cu]
        nets: [SW]
        source: reviewed_thermal_note_rev_a
  layout:
    copper:
      regions:
        - points:
            - { x_mm: 0.0, y_mm: 0.0 }
            - { x_mm: 6.0, y_mm: 0.0 }
            - { x_mm: 6.0, y_mm: 4.0 }
            - { x_mm: 0.0, y_mm: 4.0 }
          layer: F.Cu
          polarity: dark
          net: SW
          component: U1
          source_primitive: gerber_region
          source_primitive_index: 0
