project:
  version: "1"
  name: scenario_suggestions_thermal_derating_environment
libraries:
  - ../../libs/generic
board:
  nets:
    HOT: { kind: power }
    GND: { kind: ground }
  components:
    U1:
      model: generic.analog.resistor
      pins:
        A: HOT
        B: GND
  manufacturing:
    thermal_copper:
      - name: u1_heat_spreader
        component: U1
        power_loss_w: 1.5
        min_copper_area_mm2: 20.0
        rated_ambient_temperature_C: 60.0
        min_airflow_lfm: 200.0
        enclosure_profile: vented_ip20
        source: thermal_derating_note_rev_a
