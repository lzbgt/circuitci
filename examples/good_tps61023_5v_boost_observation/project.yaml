project:
  name: good_tps61023_5v_boost_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/regulators

board:
  schematic:
    component_symbols:
      VBAT: Simulation_SPICE:VDC
      VEN: Simulation_SPICE:VDC
      UBOOST: Regulator_Switching:TPS61023
      L1: Device:L
      CIN: Device:C
      COUT: Device:C
      RLOAD: Device:R
    node_styles:
      component:VBAT: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VEN: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UBOOST: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:L1: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:CIN: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:COUT: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RLOAD: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VBAT: { x: 64.0, y: 192.0 }
      component:VEN: { x: 64.0, y: 336.0 }
      component:UBOOST: { x: 320.0, y: 224.0 }
      component:L1: { x: 224.0, y: 176.0 }
      component:CIN: { x: 176.0, y: 432.0 }
      component:COUT: { x: 592.0, y: 432.0 }
      component:RLOAD: { x: 704.0, y: 336.0 }
      net:battery: { x: 160.0, y: 176.0 }
      net:boost_sw: { x: 272.0, y: 176.0 }
      net:enable: { x: 176.0, y: 304.0 }
      net:vext_5v: { x: 592.0, y: 176.0 }
      net:gnd: { x: 336.0, y: 544.0 }
    wire_routes:
      VBAT.P->battery:
        points:
          - { x: 128.0, y: 192.0 }
      VBAT.N->gnd:
        points:
          - { x: 112.0, y: 544.0 }
      VEN.P->enable:
        points:
          - { x: 160.0, y: 336.0 }
      VEN.N->gnd:
        points:
          - { x: 112.0, y: 544.0 }
      L1.A->battery:
        points:
          - { x: 176.0, y: 176.0 }
      L1.B->boost_sw:
        points:
          - { x: 272.0, y: 176.0 }
      UBOOST.VIN->battery:
        points:
          - { x: 240.0, y: 192.0 }
      UBOOST.SW->boost_sw:
        points:
          - { x: 272.0, y: 176.0 }
      UBOOST.EN->enable:
        points:
          - { x: 240.0, y: 320.0 }
      UBOOST.VOUT->vext_5v:
        points:
          - { x: 592.0, y: 176.0 }
      UBOOST.GND->gnd:
        points:
          - { x: 320.0, y: 544.0 }
      CIN.A->battery:
        points:
          - { x: 176.0, y: 176.0 }
      CIN.B->gnd:
        points:
          - { x: 176.0, y: 544.0 }
      COUT.A->vext_5v:
        points:
          - { x: 592.0, y: 176.0 }
      COUT.B->gnd:
        points:
          - { x: 592.0, y: 544.0 }
      RLOAD.A->vext_5v:
        points:
          - { x: 704.0, y: 176.0 }
      RLOAD.B->gnd:
        points:
          - { x: 704.0, y: 544.0 }
  components:
    VBAT:
      model: generic.analog.dc_voltage_source
      part_number: LIION_SOURCE
      pins:
        P: battery
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.7
    VEN:
      model: generic.analog.dc_voltage_source
      pins:
        P: enable
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.3
    UBOOST:
      model: vendor.ti.tps61023_5v
      part_number: TPS61023DRLT
      parameters:
        observation_output_voltage_V: 5.0
      power_domains:
        VIN: battery
        VOUT: vext_5v
      pins:
        VIN: battery
        EN: enable
        SW: boost_sw
        VOUT: vext_5v
        FB: feedback
        GND: gnd
    L1:
      model: generic.analog.inductor
      part_number: 1uH
      pins:
        A: battery
        B: boost_sw
      spice:
        primitive: inductor
        value_h: 0.000001
    CIN:
      model: generic.analog.capacitor
      part_number: 10uF
      pins:
        A: battery
        B: gnd
      spice:
        primitive: capacitor
        value_f: 0.000010
    COUT:
      model: generic.analog.capacitor
      part_number: 22uF
      pins:
        A: vext_5v
        B: gnd
      spice:
        primitive: capacitor
        value_f: 0.000022
    RLOAD:
      model: generic.analog.resistor
      part_number: 100R_1pct
      pins:
        A: vext_5v
        B: gnd
      spice:
        primitive: resistor
        value_ohm: 100.0
  nets:
    battery:
      kind: power
      nominal_voltage: 3.7
      powered: true
      supply_current_limit_A: 1.0
    enable:
      kind: power
      nominal_voltage: 3.3
      powered: true
    boost_sw:
      kind: digital_or_analog
    feedback:
      kind: digital_or_analog
    vext_5v:
      kind: power
      nominal_voltage: 5.0
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: tps61023_5v_boost_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VBAT
          - VEN
          - UBOOST
          - RLOAD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: 358b4fe6af6dc6178ce33d5e84a085d044bb223bc32f420bf7e9c4ae2d7fdc5b
      node_bindings:
        - { node: vbat, net: battery }
        - { node: en, net: enable }
        - { node: out5v, net: vext_5v }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vbat, endpoint: { component: VBAT, pin: P } }
        - { node: "0", endpoint: { component: VBAT, pin: N } }
        - { node: en, endpoint: { component: VEN, pin: P } }
        - { node: "0", endpoint: { component: VEN, pin: N } }
        - { node: vbat, endpoint: { component: UBOOST, pin: VIN } }
        - { node: en, endpoint: { component: UBOOST, pin: EN } }
        - { node: out5v, endpoint: { component: UBOOST, pin: VOUT } }
        - { node: "0", endpoint: { component: UBOOST, pin: GND } }
        - { node: out5v, endpoint: { component: RLOAD, pin: A } }
        - { node: "0", endpoint: { component: RLOAD, pin: B } }
      analysis:
        type: tran
        stop_time_us: 80.0
        max_step_us: 0.2
      stimuli:
        - name: enabled_liion_to_5v_boost
          description: 3.7 V input and 3.3 V enable drive a reduced TPS61023 5 V boost observation model feeding a 100 ohm load.
      probes:
        - name: v_battery
          expression: V(vbat)
        - name: v_enable
          expression: V(en)
        - name: v_rail5v
          expression: V(out5v)
        - name: i_load
          expression: I(VCCI_RLOAD)
          quantity: current
      assertions:
        - name: rail_above_4p9v
          probe: v_rail5v
          aggregation: min
          start_us: 5.0
          end_us: 80.0
          relation: above
          threshold_v: 4.9
        - name: rail_below_5p1v
          probe: v_rail5v
          aggregation: max
          start_us: 5.0
          end_us: 80.0
          relation: below
          threshold_v: 5.1
        - name: load_current_below_55ma
          probe: i_load
          aggregation: mean
          start_us: 5.0
          end_us: 80.0
          relation: below
          threshold_a: 0.055
