project:
  name: good_esp32_wroom_32e_boot_uart_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/espressif/modules

board:
  schematic:
    component_symbols:
      V3V3: Simulation_SPICE:VDC
      UESP: RF_Module:ESP32-WROOM-32E
    node_styles:
      component:V3V3: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UESP: { rotation_deg: 0, mirrored: false, pin_side: auto }
    node_positions:
      component:V3V3: { x: 80.0, y: 192.0 }
      component:UESP: { x: 384.0, y: 224.0 }
      net:rail_3v3: { x: 224.0, y: 144.0 }
      net:en: { x: 224.0, y: 224.0 }
      net:boot_io0: { x: 224.0, y: 288.0 }
      net:boot_io2: { x: 224.0, y: 352.0 }
      net:txd0: { x: 560.0, y: 272.0 }
      net:rxd0: { x: 560.0, y: 336.0 }
      net:gnd: { x: 272.0, y: 512.0 }
    wire_routes:
      V3V3.P->rail_3v3:
        points:
          - { x: 176.0, y: 160.0 }
      V3V3.N->gnd:
        points:
          - { x: 112.0, y: 512.0 }
      UESP.3V3->rail_3v3:
        points:
          - { x: 304.0, y: 160.0 }
      UESP.GND->gnd:
        points:
          - { x: 384.0, y: 512.0 }
      UESP.EN->en:
        points:
          - { x: 304.0, y: 224.0 }
      UESP.IO0->boot_io0:
        points:
          - { x: 304.0, y: 288.0 }
      UESP.IO2->boot_io2:
        points:
          - { x: 304.0, y: 352.0 }
      UESP.TXD0->txd0:
        points:
          - { x: 512.0, y: 272.0 }
      UESP.RXD0->rxd0:
        points:
          - { x: 512.0, y: 336.0 }
  components:
    V3V3:
      model: generic.analog.dc_voltage_source
      part_number: MODULE_3V3_SOURCE
      pins:
        P: rail_3v3
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.3
    UESP:
      model: vendor.espressif.esp32_wroom_32e
      part_number: ESP32-WROOM-32E-N4
      parameters:
        observation_en_state: 1.0
        observation_io0_state: 1.0
        observation_io2_state: 0.0
        observation_txd0_state: 1.0
      power_domains:
        3V3: rail_3v3
      pins:
        3V3: rail_3v3
        GND: gnd
        EN: en
        IO0: boot_io0
        IO2: boot_io2
        TXD0: txd0
        RXD0: rxd0
  nets:
    rail_3v3:
      kind: power
      nominal_voltage: 3.3
      powered: true
    en:
      kind: digital_or_analog
      nominal_voltage: 3.3
    boot_io0:
      kind: digital_or_analog
      nominal_voltage: 3.3
    boot_io2:
      kind: digital_or_analog
      nominal_voltage: 0.0
    txd0:
      kind: digital_or_analog
      nominal_voltage: 2.64
    rxd0:
      kind: digital_or_analog
      nominal_voltage: 3.3
    gnd:
      kind: ground

scenarios:
  - name: esp32_wroom_32e_boot_uart_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - V3V3
          - UESP
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: f60605ae432f40edfd66c43b4d8e99dad7c8220be2c0ecdc0fb7bd17be61296a
      node_bindings:
        - { node: vdd3v3, net: rail_3v3 }
        - { node: en, net: en }
        - { node: io0, net: boot_io0 }
        - { node: io2, net: boot_io2 }
        - { node: txd0, net: txd0 }
        - { node: rxd0, net: rxd0 }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: vdd3v3, endpoint: { component: V3V3, pin: P } }
        - { node: "0", endpoint: { component: V3V3, pin: N } }
        - { node: vdd3v3, endpoint: { component: UESP, pin: 3V3 } }
        - { node: "0", endpoint: { component: UESP, pin: GND } }
        - { node: en, endpoint: { component: UESP, pin: EN } }
        - { node: io0, endpoint: { component: UESP, pin: IO0 } }
        - { node: io2, endpoint: { component: UESP, pin: IO2 } }
        - { node: txd0, endpoint: { component: UESP, pin: TXD0 } }
        - { node: rxd0, endpoint: { component: UESP, pin: RXD0 } }
      analysis:
        type: tran
        stop_time_us: 100.0
        max_step_us: 0.2
      stimuli:
        - name: spi_flash_boot_uart_idle
          description: 3.3 V ESP32-WROOM-32E module observation with EN high, GPIO0 high, GPIO2 low, and TXD0 idle high.
      probes:
        - name: v_3v3
          expression: V(vdd3v3)
        - name: v_en
          expression: V(en)
        - name: v_io0
          expression: V(io0)
        - name: v_io2
          expression: V(io2)
        - name: v_txd0
          expression: V(txd0)
      assertions:
        - name: rail_above_min
          probe: v_3v3
          aggregation: min
          start_us: 0.0
          end_us: 100.0
          relation: above
          threshold_v: 3.0
        - name: rail_below_max
          probe: v_3v3
          aggregation: max
          start_us: 0.0
          end_us: 100.0
          relation: below
          threshold_v: 3.6
        - name: en_released_high
          probe: v_en
          aggregation: mean
          start_us: 0.0
          end_us: 100.0
          relation: above
          threshold_v: 2.475
        - name: gpio0_spi_flash_boot_high
          probe: v_io0
          aggregation: mean
          start_us: 0.0
          end_us: 100.0
          relation: above
          threshold_v: 2.475
        - name: gpio2_spi_flash_boot_low
          probe: v_io2
          aggregation: mean
          start_us: 0.0
          end_us: 100.0
          relation: below
          threshold_v: 0.825
        - name: txd0_idle_high
          probe: v_txd0
          aggregation: mean
          start_us: 0.0
          end_us: 100.0
          relation: above
          threshold_v: 2.3
