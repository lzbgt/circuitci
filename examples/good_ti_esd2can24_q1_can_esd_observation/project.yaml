project:
  name: good_ti_esd2can24_q1_can_esd_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/esd_protection

board:
  schematic:
    component_symbols:
      VCANH: Simulation_SPICE:VDC
      VCANL: Simulation_SPICE:VDC
      UESD: Interface_CAN:ESD2CAN24-Q1
    node_styles:
      component:VCANH: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VCANL: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UESD: { rotation_deg: 0, mirrored: false, pin_side: auto }
    node_positions:
      component:VCANH: { x: 64.0, y: 160.0 }
      component:VCANL: { x: 64.0, y: 320.0 }
      component:UESD: { x: 352.0, y: 240.0 }
      net:canh: { x: 208.0, y: 160.0 }
      net:canl: { x: 208.0, y: 320.0 }
      net:gnd: { x: 352.0, y: 480.0 }
    wire_routes:
      VCANH.P->canh:
        points:
          - { x: 160.0, y: 176.0 }
      VCANH.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      VCANL.P->canl:
        points:
          - { x: 160.0, y: 336.0 }
      VCANL.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      UESD.CANH->canh:
        points:
          - { x: 288.0, y: 176.0 }
      UESD.CANL->canl:
        points:
          - { x: 288.0, y: 336.0 }
      UESD.GND->gnd:
        points:
          - { x: 352.0, y: 480.0 }
  components:
    VCANH:
      model: generic.analog.dc_voltage_source
      pins:
        P: canh
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 3.5
    VCANL:
      model: generic.analog.dc_voltage_source
      pins:
        P: canl
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 1.5
    UESD:
      model: vendor.ti.esd2can24_q1
      part_number: ESD2CAN24-Q1
      pins:
        CANH: canh
        CANL: canl
        GND: gnd
  nets:
    canh:
      kind: power
      nominal_voltage: 3.5
      powered: true
    canl:
      kind: power
      nominal_voltage: 1.5
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: esd2can24_q1_can_esd_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VCANH
          - VCANL
          - UESD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: a6cf0aa0df3043986604cfecb2d3b4428d496e7151ccb7b162afc79a8af3d2c6
      node_bindings:
        - { node: canh, net: canh }
        - { node: canl, net: canl }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: canh, endpoint: { component: VCANH, pin: P } }
        - { node: "0", endpoint: { component: VCANH, pin: N } }
        - { node: canl, endpoint: { component: VCANL, pin: P } }
        - { node: "0", endpoint: { component: VCANL, pin: N } }
        - { node: canh, endpoint: { component: UESD, pin: CANH } }
        - { node: canl, endpoint: { component: UESD, pin: CANL } }
        - { node: "0", endpoint: { component: UESD, pin: GND } }
      analysis:
        type: tran
        stop_time_us: 20.0
        max_step_us: 0.1
      stimuli:
        - name: normal_can_dominant_line_standoff
          description: ESD2CAN24-Q1 observes normal CAN dominant-state line voltages below the 24 V standoff limit with datasheet 3 pF line capacitance.
      probes:
        - name: v_canh
          expression: V(canh)
        - name: v_canl
          expression: V(canl)
        - name: i_canh_source
          expression: I(VCANH)
          quantity: current
        - name: i_canl_source
          expression: I(VCANL)
          quantity: current
      assertions:
        - name: canh_below_standoff
          probe: v_canh
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 24.0
        - name: canl_below_standoff
          probe: v_canl
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 24.0
        - name: canh_dominant_high_level
          probe: v_canh
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: above
          threshold_v: 3.0
        - name: canl_dominant_low_level
          probe: v_canl
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 2.0
