project:
  name: scenario_suggestions_pin_1_orientation
  version: 0.1.0
libraries:
  - ../../libs/generic/analog
board:
  components:
    U1:
      model: generic.analog.resistor
      pins:
        A: NET1
        B: GND
  nets:
    NET1:
      kind: digital_or_analog
    GND:
      kind: ground
  layout:
    footprints:
      U1:
        semantics:
          body_bounds:
            min: { x_mm: -1.0, y_mm: -1.0 }
            max: { x_mm: 1.0, y_mm: 1.0 }
            source: kicad_footprint_graphics
          pin_1:
            at: { x_mm: -0.6, y_mm: 0.0 }
            source: kicad_pad_1
