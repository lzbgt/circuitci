project:
  name: good_ti_esds552_rs485_esd_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor/ti/esd_protection

board:
  schematic:
    component_symbols:
      VA: Simulation_SPICE:VDC
      VB: Simulation_SPICE:VDC
      UESD: Interface_RS485:ESDS552
    node_styles:
      component:VA: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VB: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UESD: { rotation_deg: 0, mirrored: false, pin_side: auto }
    node_positions:
      component:VA: { x: 64.0, y: 160.0 }
      component:VB: { x: 64.0, y: 320.0 }
      component:UESD: { x: 352.0, y: 240.0 }
      net:rs485_a: { x: 208.0, y: 160.0 }
      net:rs485_b: { x: 208.0, y: 320.0 }
      net:gnd: { x: 352.0, y: 480.0 }
    wire_routes:
      VA.P->rs485_a:
        points:
          - { x: 160.0, y: 176.0 }
      VA.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      VB.P->rs485_b:
        points:
          - { x: 160.0, y: 336.0 }
      VB.N->gnd:
        points:
          - { x: 112.0, y: 480.0 }
      UESD.A->rs485_a:
        points:
          - { x: 288.0, y: 176.0 }
      UESD.B->rs485_b:
        points:
          - { x: 288.0, y: 336.0 }
      UESD.GND->gnd:
        points:
          - { x: 352.0, y: 480.0 }
  components:
    VA:
      model: generic.analog.dc_voltage_source
      pins:
        P: rs485_a
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 2.5
    VB:
      model: generic.analog.dc_voltage_source
      pins:
        P: rs485_b
        N: gnd
      spice:
        primitive: dc_voltage_source
        dc_v: 0.5
    UESD:
      model: vendor.ti.esds552
      part_number: ESDS552
      pins:
        A: rs485_a
        B: rs485_b
        GND: gnd
  nets:
    rs485_a:
      kind: power
      nominal_voltage: 2.5
      powered: true
    rs485_b:
      kind: power
      nominal_voltage: 0.5
      powered: true
    gnd:
      kind: ground

scenarios:
  - name: esds552_rs485_esd_observation
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: generated_from_board
      generated:
        ground_net: gnd
        components:
          - VA
          - VB
          - UESD
      model_files:
        - path: ../../models/spice/generic/analog_behavioral.lib
          sha256: ad5aec2585e6d9803b3b6f7930c19148e252c1cf4362b550893e85afdd025e59
      node_bindings:
        - { node: rs485_a, net: rs485_a }
        - { node: rs485_b, net: rs485_b }
        - { node: "0", net: gnd }
      pin_bindings:
        - { node: rs485_a, endpoint: { component: VA, pin: P } }
        - { node: "0", endpoint: { component: VA, pin: N } }
        - { node: rs485_b, endpoint: { component: VB, pin: P } }
        - { node: "0", endpoint: { component: VB, pin: N } }
        - { node: rs485_a, endpoint: { component: UESD, pin: A } }
        - { node: rs485_b, endpoint: { component: UESD, pin: B } }
        - { node: "0", endpoint: { component: UESD, pin: GND } }
      analysis:
        type: tran
        stop_time_us: 20.0
        max_step_us: 0.1
      stimuli:
        - name: normal_rs485_line_standoff
          description: ESDS552 observes normal RS-485 A/B line voltages below the 12 V standoff limit with datasheet 11 pF line capacitance.
      probes:
        - name: v_rs485_a
          expression: V(rs485_a)
        - name: v_rs485_b
          expression: V(rs485_b)
        - name: i_a_source
          expression: I(VA)
          quantity: current
        - name: i_b_source
          expression: I(VB)
          quantity: current
      assertions:
        - name: a_below_standoff
          probe: v_rs485_a
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 12.0
        - name: b_below_standoff
          probe: v_rs485_b
          aggregation: max
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 12.0
        - name: a_normal_high_level
          probe: v_rs485_a
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: above
          threshold_v: 2.0
        - name: b_normal_low_level
          probe: v_rs485_b
          aggregation: mean
          start_us: 1.0
          end_us: 20.0
          relation: below
          threshold_v: 1.0
