# Scope-ready RC low-pass GUI example.
#
# The file-backed SPICE deck keeps the sine source explicit while this Board IR
# shell gives the GUI a connected, editable schematic and named scope probes.
project:
  name: rc_lowpass_scope
  version: 0.1.0

libraries:
  - ../../libs/generic/analog

board:
  schematic:
    component_symbols:
      VSIN: Simulation_SPICE:VSIN
      RIN: Device:R
      COUT: Device:C
    node_styles:
      component:VSIN: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RIN: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:COUT: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VSIN: { x: 32.0, y: 208.0 }
      component:RIN: { x: 256.0, y: 208.0 }
      component:COUT: { x: 384.0, y: 336.0 }
      net:input: { x: 160.0, y: 192.0 }
      net:filtered: { x: 384.0, y: 192.0 }
      net:gnd: { x: 176.0, y: 496.0 }
    wire_routes:
      VSIN.P->input:
        points:
          - { x: 240.0, y: 288.0 }
      VSIN.N->gnd:
        points:
          - { x: 80.0, y: 512.0 }
      RIN.A->input:
        points:
          - { x: 240.0, y: 240.0 }
      RIN.B->filtered:
        points:
          - { x: 464.0, y: 240.0 }
      COUT.A->filtered:
        points:
          - { x: 464.0, y: 336.0 }
      COUT.B->gnd:
        points:
          - { x: 432.0, y: 512.0 }
  components:
    VSIN:
      model: generic.analog.imported_spice_device
      pins:
        P: input
        N: gnd
    RIN:
      model: generic.analog.resistor
      pins:
        A: input
        B: filtered
      spice:
        primitive: resistor
        value_ohm: 1000.0
    COUT:
      model: generic.analog.capacitor
      pins:
        A: filtered
        B: gnd
      spice:
        primitive: capacitor
        value_f: 1e-7
  nets:
    input:
      kind: digital_or_analog
    filtered:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: rc_lowpass_sine_transient
    type: analog_transient
    checks:
      - SPICE_TRANSIENT_ANALYSIS
    analog:
      backend: auto
      netlist_source: file
      netlist: deck.cir
      model_files: []
      node_bindings:
        - { node: "0", net: gnd }
        - { node: input, net: input }
        - { node: filtered, net: filtered }
      pin_bindings:
        - { node: input, endpoint: { component: VSIN, pin: P } }
        - { node: "0", endpoint: { component: VSIN, pin: N } }
        - { node: input, endpoint: { component: RIN, pin: A } }
        - { node: filtered, endpoint: { component: RIN, pin: B } }
        - { node: filtered, endpoint: { component: COUT, pin: A } }
        - { node: "0", endpoint: { component: COUT, pin: B } }
      analysis:
        type: tran
        stop_time_us: 10000.0
        max_step_us: 5.0
      stimuli:
        - name: sine_input
          description: 1 kHz, 1 V peak sine source defined in deck.cir.
      sweeps:
        - name: rc_tolerance
          parameters:
            - name: RIN_VALUE
              values: [950.0, 1000.0, 1050.0]
            - name: COUT_VALUE
              values: [0.000000095, 0.0000001, 0.000000105]
      probes:
        - name: v_input
          expression: V(input)
        - name: v_filtered
          expression: V(filtered)
        - name: i_vsin
          expression: I(VSIN)
          quantity: current
      assertions:
        - name: input_rms_present
          probe: v_input
          aggregation: rms
          relation: above
          threshold_v: 0.69
          start_us: 5000.0
          end_us: 10000.0
        - name: filtered_rms_attenuated
          probe: v_filtered
          aggregation: rms
          relation: below
          threshold_v: 0.62
          start_us: 5000.0
          end_us: 10000.0
        - name: filtered_rising_lag_below_150us
          probe: v_filtered
          aggregation: rising_phase_delay
          relation: below
          threshold_v: 0.0
          reference_probe: v_input
          reference_threshold_v: 0.0
          start_us: 5000.0
          end_us: 10000.0
          time_limit_us: 150.0
        - name: filtered_rising_hold_above_50us
          probe: v_filtered
          aggregation: rising_hold_time
          relation: above
          threshold_v: 0.0
          reference_probe: v_input
          reference_threshold_v: 0.0
          start_us: 5000.0
          end_us: 10000.0
          time_limit_us: 50.0
  - name: rc_lowpass_bode_ac
    type: analog_ac
    checks:
      - SPICE_AC_ANALYSIS
    analog:
      backend: auto
      netlist_source: file
      netlist: deck_ac.cir
      model_files: []
      node_bindings:
        - { node: "0", net: gnd }
        - { node: input, net: input }
        - { node: filtered, net: filtered }
      pin_bindings:
        - { node: input, endpoint: { component: VSIN, pin: P } }
        - { node: "0", endpoint: { component: VSIN, pin: N } }
        - { node: input, endpoint: { component: RIN, pin: A } }
        - { node: filtered, endpoint: { component: RIN, pin: B } }
        - { node: filtered, endpoint: { component: COUT, pin: A } }
        - { node: "0", endpoint: { component: COUT, pin: B } }
      analysis:
        type: ac
        start_frequency_hz: 10.0
        stop_frequency_hz: 100000.0
        points_per_decade: 20
      stimuli:
        - name: small_signal_input
          description: 1 V AC source defined in deck_ac.cir.
      sweeps:
        - name: rc_tolerance
          parameters:
            - name: RIN_VALUE
              values: [950.0, 1000.0, 1050.0]
            - name: COUT_VALUE
              values: [0.000000095, 0.0000001, 0.000000105]
      probes:
        - name: input
          expression: V(input)
        - name: filtered
          expression: V(filtered)
      assertions:
        - name: filtered_gain_at_1khz_below_minus_1db
          probe: filtered
          aggregation: gain_db_at_frequency
          relation: below
          at_hz: 1000.0
          threshold_db: -1.0
        - name: filtered_phase_at_1khz_below_minus_20deg
          probe: filtered
          aggregation: phase_deg_at_frequency
          relation: below
          at_hz: 1000.0
          threshold_deg: -20.0
        - name: filtered_cutoff_above_1_4khz
          probe: filtered
          aggregation: falling_gain_crossing_frequency
          relation: above
          threshold_db: -3.0
          frequency_limit_hz: 1400.0
