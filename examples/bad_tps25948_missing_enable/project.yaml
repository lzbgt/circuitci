project:
  name: bad_tps25948_missing_enable
  version: 0.1.0

libraries:
  - ../../libs/vendor/ti/efuses

board:
  components:
    UEFUSE:
      model: vendor.ti.tps25948_8a_rcb_dvdt
      part_number: TPS259480AYWP
      power_domains:
        VIN: input_12v
        VOUT: protected_12v
      pins:
        VIN: input_12v
        VOUT: protected_12v
        GND: gnd
        EN: efuse_enable
  nets:
    input_12v:
      kind: power
      nominal_voltage: 12.0
      powered: true
    protected_12v:
      kind: power
      nominal_voltage: 12.0
      powered: true
    efuse_enable:
      kind: digital_or_analog
    gnd:
      kind: ground

scenarios:
  - name: tps25948_missing_enable_evidence
    type: power_tree
    checks:
      - POWER_TREE_VALID
