project:
  name: bad_st_stm8s003f3p6_vdd_overvoltage
  version: 0.1.0

libraries:
  - ../../libs/generic
  - ../../libs/vendor

board:
  components:
    USTM8:
      model: vendor.st.stm8s003f3p6
      part_number: STM8S003F3P6
      power_domains:
        VDD: rail_6v
      pins:
        VDD: rail_6v
        VSS: gnd
        VCAP: stm8_vcap
        NRST: stm8_nrst
    CVCAP:
      model: generic.analog.capacitor
      part_number: 1uF
      pins:
        A: stm8_vcap
        B: gnd
      spice:
        primitive: capacitor
        value_f: 0.000001
    RNRST_UP:
      model: generic.analog.resistor
      part_number: 10K
      pins:
        A: rail_6v
        B: stm8_nrst
      spice:
        primitive: resistor
        value_ohm: 10000
  nets:
    rail_6v:
      kind: power
      nominal_voltage: 6.0
      powered: true
    gnd:
      kind: ground
    stm8_vcap:
      kind: digital_or_analog
    stm8_nrst:
      kind: digital_or_analog

scenarios:
  - name: stm8s003f3p6_vdd_overvoltage
    type: power_tree
    checks:
      - POWER_TREE_VALID
