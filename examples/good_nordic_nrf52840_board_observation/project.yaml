project:
  name: good_nordic_nrf52840_board_observation
  version: 0.1.0

libraries:
  - ../../libs/generic/analog
  - ../../libs/vendor

board:
  schematic:
    component_symbols:
      VDD: Simulation_SPICE:VDC
      VUSB: Simulation_SPICE:VDC
      UNRF: MCU_Nordic:nRF52840-QIAA
      RRESET: Device:R
      RSWDIO: Device:R
      RSWDCLK: Device:R
      RTX: Device:R
      RRX: Device:R
      RDP: Device:R
      RDM: Device:R
      RANT: Device:R
    node_styles:
      component:VDD: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:VUSB: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:UNRF: { rotation_deg: 0, mirrored: false, pin_side: auto }
      component:RRESET: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RSWDIO: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RSWDCLK: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RTX: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RRX: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RDP: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RDM: { rotation_deg: 90, mirrored: false, pin_side: auto }
      component:RANT: { rotation_deg: 90, mirrored: false, pin_side: auto }
    node_positions:
      component:VDD: { x: 72.0, y: 156.0 }
      component:VUSB: { x: 72.0, y: 316.0 }
      component:UNRF: { x: 360.0, y: 304.0 }
      component:RRESET: { x: 800.0, y: 96.0 }
      component:RSWDIO: { x: 800.0, y: 184.0 }
      component:RSWDCLK: { x: 800.0, y: 272.0 }
      component:RTX: { x: 800.0, y: 360.0 }
      component:RRX: { x: 800.0, y: 448.0 }
      component:RDP: { x: 800.0, y: 536.0 }
      component:RDM: { x: 800.0, y: 608.0 }
      component:RANT: { x: 560.0, y: 640.0 }
      net:nrf_3v3: { x: 224.0, y: 88.0 }
      net:usb_5v: { x: 224.0, y: 248.0 }
      net:reset_n: { x: 688.0, y: 96.0 }
      net:swdio: { x: 688.0, y: 184.0 }
      net:swdclk: { x: 688.0, y: 272.0 }
      net:uart_tx: { x: 688.0, y: 360.0 }
      net:uart_rx: { x: 688.0, y: 448.0 }
      net:usb_dp: { x: 688.0, y: 536.0 }
      net:usb_dm: { x: 688.0, y: 608.0 }
      net:ant_feed: { x: 520.0, y: 592.0 }
      net:gnd: { x: 360.0, y: 680.0 }
    wire_routes:
      VDD.P->nrf_3v3:
