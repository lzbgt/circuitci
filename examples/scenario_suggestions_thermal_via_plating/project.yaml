project:
  version: "1"
  name: scenario_suggestions_thermal_via_plating

libraries:
  - ../../libs/generic

board:
  nets:
    HOT: { kind: power }
    GND: { kind: ground }

  components:
    U1:
      model: generic.analog.resistor
      pins:
        A: HOT
        B: GND

  manufacturing:
    thermal_copper:
      - name: u1_heat_spreader
        component: U1
        source: thermal_layout_note_rev_a
        power_loss_w: 1.5
        min_copper_area_mm2: 20.0
        min_plated_thermal_via_count: 2
        min_thermal_via_drill_mm: 0.25
        min_thermal_via_plating_thickness_um: 20.0
        min_total_thermal_via_barrel_cross_section_mm2: 0.04
        nets: [HOT]
        layers: [F.Cu, B.Cu]

  layout:
    routes:
      HOT:
        vias:
          - at: { x_mm: 1.0, y_mm: 1.0 }
            size_mm: 0.60
            drill_mm: 0.30
            layers: [F.Cu, B.Cu]
          - at: { x_mm: 2.0, y_mm: 1.0 }
            size_mm: 0.60
            drill_mm: 0.30
            layers: [F.Cu, B.Cu]
    drills:
      - at: { x_mm: 1.0, y_mm: 1.0 }
        drill_mm: 0.30
        plating: plated
        plating_thickness_um: 25.0
        net: HOT
        via_index: 0
      - at: { x_mm: 2.0, y_mm: 1.0 }
        drill_mm: 0.30
        plating: plated
        plating_thickness_um: 25.0
        net: HOT
        via_index: 1
    copper:
      regions:
        - points:
            - { x_mm: 0.0, y_mm: 0.0 }
            - { x_mm: 5.0, y_mm: 0.0 }
            - { x_mm: 5.0, y_mm: 5.0 }
            - { x_mm: 0.0, y_mm: 5.0 }
          layer: F.Cu
          polarity: dark
          net: HOT
          component: U1
          source_primitive: gerber_region
          source_primitive_index: 0

scenarios: []
