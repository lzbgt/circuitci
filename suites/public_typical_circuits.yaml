    project: ../examples/good_drill_diameter_jlc_process/project.yaml
    expect: pass

  - id: jlcpcb_drill_diameter_process_detected
    project: ../examples/bad_drill_diameter_jlc_process/project.yaml
    expect: fail
    required_findings:
